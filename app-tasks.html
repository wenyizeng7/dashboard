                <div class="nav-item view-tab w-full flex items-center justify-between px-3 py-1.5 text-gray-700 group cursor-pointer drag-item" draggable="true" ondragstart="app.handleDragStart(event, '${l.id}', 'list')" ondragend="app.handleDragEnd(event)" ondragover="app.handleDragOver(event)" ondrop="app.handleDrop(event, '${l.id}', 'list')" data-target="view-tasks" data-filter="lst_${l.id}">
                    <div class="flex items-center gap-3"><i class="fas ${l.icon} w-4 text-center" style="color:${l.color}"></i><span class="text-sm truncate">${l.name}</span></div>
                    <i class="fas fa-pen text-[10px] text-gray-300 opacity-0 group-hover:opacity-100 hover:text-gray-600" onclick="event.stopPropagation(); modals.openListModal('${l.id}')"></i>
                </div>`;
            },

            handleDragStart(e, id, type) {
                e.stopPropagation();
                e.dataTransfer.setData('text/plain', id);
                e.dataTransfer.setData('type', type);
                setTimeout(() => e.target.closest('.drag-item').classList.add('opacity-40'), 0);
            },
            handleDragEnd(e) {
                document.querySelectorAll('.drag-item').forEach(el => el.classList.remove('opacity-40'));
            },
            handleDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
            },
            handleDrop(e, targetId, targetType) {
                e.preventDefault();
                e.stopPropagation();
                document.querySelectorAll('.drag-item').forEach(el => el.classList.remove('opacity-40'));
                
                const draggedId = e.dataTransfer.getData('text/plain');
                const dragType = e.dataTransfer.getData('type');
                
                if (!draggedId || draggedId === targetId) return;

                if (dragType === 'list' && targetType === 'list') {
                    const fromIdx = state.lists.findIndex(l => l.id === draggedId);
                    const toIdx = state.lists.findIndex(l => l.id === targetId);
                    if(fromIdx < 0 || toIdx < 0) return;
                    const [moved] = state.lists.splice(fromIdx, 1);
                    moved.folderId = state.lists[toIdx].folderId; 
                    state.lists.splice(toIdx, 0, moved);
                } else if (dragType === 'folder' && targetType === 'folder') {
                    const fromIdx = state.folders.findIndex(f => f.id === draggedId);
                    const toIdx = state.folders.findIndex(f => f.id === targetId);
                    if(fromIdx < 0 || toIdx < 0) return;
                    const [moved] = state.folders.splice(fromIdx, 1);
                    state.folders.splice(toIdx, 0, moved);
                } else if (dragType === 'list' && targetType === 'folder') {
                    const moved = state.lists.find(l => l.id === draggedId);
                    if(moved) {
                        moved.folderId = targetId === 'root' ? null : targetId;
                        state.lists.push(state.lists.splice(state.lists.indexOf(moved), 1)[0]);
                    }
                }
                this.renderSidebar();
            },

            toggleArchive() {
                document.getElementById('archive-list-container').classList.toggle('hidden');
                document.getElementById('archive-chevron').classList.toggle('-rotate-90');
            },

            updateCounts() {
                const today = getTodayStr();
                document.getElementById('count-inbox').innerText = state.tasks.filter(t=> t.listId==='inbox' && !t.completed).length || '';
                document.getElementById('count-today').innerText = state.tasks.filter(t=> t.startDate===today && !t.completed).length || '';
            },

            toggleListSection() {
                state.listSectionCollapsed = !state.listSectionCollapsed;
                this.renderSidebar();
            },

            toggleFolder(id) {
                const fd = state.folders.find(x => x.id === id);
                if (fd) {
                    fd.collapsed = !fd.collapsed;
                    this.renderSidebar();
                }
            },
            
            exportData() {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
                const dlAnchorElem = document.createElement('a');
                dlAnchorElem.setAttribute("href", dataStr);
                dlAnchorElem.setAttribute("download", `ticktick_backup_${getTodayStr()}.json`);
                document.body.appendChild(dlAnchorElem); dlAnchorElem.click(); dlAnchorElem.remove();
            },

            importData(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedState = JSON.parse(e.target.result);
                        
                        // 覆盖并应用导入的数据，确保清除现有的数据缓存
                        state.folders = importedState.folders || [];
                        state.lists = importedState.lists || [];
                        state.tags = importedState.tags || [];
                        state.filters = importedState.filters || [];
                        state.tasks = importedState.tasks || [];
                        state.habits = importedState.habits || [];
                        state.countdowns = importedState.countdowns || [];
                        if (importedState.focus) state.focus = importedState.focus;

                        // 强制将日历重置为当前日期（避免字符串在JSON转换时破坏Date对象的原型链引起报错）
                        state.calCurrentDate = new Date();

                        this.renderSidebar(); 
                        this.refreshCurrentView();
                        alert("数据导入成功！页面已刷新。"); 
                    } catch(err) { 
                        console.error(err);
                        alert("文件格式错误，导入失败。"); 
                    }
                };
                reader.readAsText(file); event.target.value = ''; 
            },

            saveFolder() {
                const n = document.getElementById('folder-edit-name').value.trim();
                if(!n) return;
                if(state.editingFolderId) state.folders.find(x=>x.id===state.editingFolderId).name = n;
                else state.folders.push({id: 'fd'+Date.now(), name: n, collapsed: false});
                modals.closeAll(); this.renderSidebar();
            },
            saveList() {
                const n = document.getElementById('list-edit-name').value.trim();
                const fId = document.getElementById('list-folder-select').value;
                const c = document.getElementById('list-color-picker').value;
                const i = document.querySelector('.list-icon-opt.bg-blue-100').dataset.icon;
                if(!n) return;
                if(state.editingListId) {
                    const l = state.lists.find(x=>x.id===state.editingListId);
                    l.name = n; l.folderId = fId || null; l.color = c; l.icon = i;
                    l.archived = document.getElementById('list-archive-cb').checked;
                } else {
                    state.lists.push({ id: 'l'+Date.now(), name: n, folderId: fId||null, color: c, icon: i, archived: false });
                }
                modals.closeAll(); this.renderSidebar(); this.refreshCurrentView();
            },
            saveTag() {
                const n = document.getElementById('tag-edit-name').value.trim();
                const c = document.getElementById('tag-color-picker').value;
                if(!n) return;
                if(state.editingTagId) {
                    const t = state.tags.find(x=>x.id===state.editingTagId);
                    t.name = n; t.color = c;
                } else { state.tags.push({id: 't'+Date.now(), name: n, color: c}); }
                modals.closeAll(); this.renderSidebar(); this.refreshCurrentView();
            },
            deleteTag() {
                if(!state.editingTagId) return;
                state.tags = state.tags.filter(x=>x.id !== state.editingTagId);
                state.tasks.forEach(t => t.tags = t.tags.filter(id => id !== state.editingTagId));
                state.filters.forEach(f => f.tags = f.tags.filter(id => id !== state.editingTagId));
                modals.closeAll(); this.renderSidebar(); this.refreshCurrentView();
            },
            saveFilter() {
                const n = document.getElementById('filter-edit-name').value.trim();
                const dr = document.getElementById('filter-date-range').value;
                if(!n) return;
                const ls = Array.from(document.querySelectorAll('.flt-list-cb:checked')).map(cb=>cb.value);
                const ts = Array.from(document.querySelectorAll('.flt-tag-cb:checked')).map(cb=>cb.value);
                if(state.editingFilterId) {
                    const f = state.filters.find(x=>x.id===state.editingFilterId);
                    f.name = n; f.dateRange = dr; f.lists = ls; f.tags = ts;
                } else {
                    state.filters.push({ id: 'f'+Date.now(), name: n, dateRange: dr, lists: ls, tags: ts });
                }
                modals.closeAll(); this.renderSidebar();
            },
            deleteFilter() {
                if(!state.editingFilterId) return;
                state.filters = state.filters.filter(x=>x.id !== state.editingFilterId);
                modals.closeAll(); this.renderSidebar();
                if(state.currentFilter === 'flt_' + state.editingFilterId) router.switchView('view-tasks', 'today', '今天');
            },

            refreshCurrentView() {
                if(state.currentView === 'view-tasks') { this.populateQuickAddDropdowns(); this.renderTasks(); }
                if(state.currentView === 'view-calendar') this.renderCalendar();
                if(state.currentView === 'view-stats') this.renderStats();
                this.saveState();
            },

            populateQuickAddDropdowns() {
                const listSel = document.getElementById('quick-add-list');
                const prevVal = listSel.value;
                listSel.innerHTML = `<option value="inbox">收集箱</option>` + state.lists.filter(l=>!l.archived).map(l => `<option value="${l.id}">${l.name}</option>`).join('');
                if(state.currentFilter && state.currentFilter.startsWith('lst_')) {
                    listSel.value = state.currentFilter.substring(4);
                } else if(prevVal) { listSel.value = prevVal; }
                
                const tagDrop = document.getElementById('quick-add-tags-dropdown');
                tagDrop.innerHTML = state.tags.map(t => `
                    <label class="flex items-center gap-1.5 text-xs border rounded-md px-2 py-1 cursor-pointer hover:bg-gray-50 transition-colors" style="color:${t.color}; border-color:${t.color}40; background:${t.color}05">
                        <input type="checkbox" value="${t.id}" class="hidden qa-tag-cb" onchange="this.parentElement.style.background = this.checked ? '${t.color}20' : '${t.color}05'">
                        <span class="font-medium">${t.name}</span>
                    </label>
                `).join('');
                
                if(!document.getElementById('quick-add-date').value) document.getElementById('quick-add-date').value = getTodayStr();
            },

            toggleQuickAddMultiDay() {
                const type = document.getElementById('quick-add-day-type').value;
                const endDt = document.getElementById('quick-add-end-date-wrapper');
                if (type === 'multi') endDt.classList.remove('hidden'); else endDt.classList.add('hidden');
                endDt.style.display = type === 'multi' ? 'flex' : '';
            },

            toggleQuickAddTime() {
                const type = document.getElementById('quick-add-time-type').value;
                const st = document.getElementById('quick-add-start-time');
                const et = document.getElementById('quick-add-end-time');
                const sep = document.getElementById('quick-add-time-sep');
                if (type === 'none') { st.classList.add('hidden'); et.classList.add('hidden'); sep.classList.add('hidden'); } 
                else if (type === 'time') { st.classList.remove('hidden'); et.classList.add('hidden'); sep.classList.add('hidden'); } 
                else if (type === 'range') { st.classList.remove('hidden'); et.classList.remove('hidden'); sep.classList.remove('hidden'); }
            },

            submitQuickAdd() {
                const title = document.getElementById('quick-add-title').value.trim();
                const desc = document.getElementById('quick-add-desc').value.trim();
                if (!title) return;
                
                const startDate = document.getElementById('quick-add-date').value;
                const dayType = document.getElementById('quick-add-day-type').value;
                const endDate = dayType === 'multi' ? document.getElementById('quick-add-end-date').value : null;

                const timeType = document.getElementById('quick-add-time-type').value;
                const startTime = (timeType === 'time' || timeType === 'range') ? document.getElementById('quick-add-start-time').value : null;
                const endTime = timeType === 'range' ? document.getElementById('quick-add-end-time').value : null;

                const listId = document.getElementById('quick-add-list').value;
                const priority = document.getElementById('quick-add-priority').value;
                const tags = Array.from(document.querySelectorAll('.qa-tag-cb:checked')).map(cb => cb.value);

                state.tasks.unshift({
                    id: 'tk'+Date.now(), title, description: desc, listId, 
                    startDate: startDate || getTodayStr(), startTime, endDate, endTime, 
                    completed: false, tags, priority, created: getTodayStr(), focusTime: 0
                });

                document.getElementById('quick-add-title').value = '';
                document.getElementById('quick-add-desc').value = '';
                document.querySelectorAll('.qa-tag-cb').forEach(cb => {
                    cb.checked = false; cb.parentElement.style.background = cb.parentElement.style.color.replace('rgb', 'rgba').replace(')', ', 0.05)');
                });
                document.getElementById('quick-add-tags-dropdown').classList.add('hidden');
                
                this.refreshCurrentView(); this.updateCounts();
            },

            bindQuickAdd() {
                const inp = document.getElementById('quick-add-title');
                inp.addEventListener('keypress', (e) => {
                    if(e.key === 'Enter') { e.preventDefault(); this.submitQuickAdd(); }
                });
                this.populateQuickAddDropdowns();
            },

            renderTasks() {
                const c = document.getElementById('task-list-container');
                const f = state.currentFilter;
                const today = getTodayStr();
                let filtered = []; let grouped = false;

                if (f === 'inbox') filtered = state.tasks.filter(t => t.listId === 'inbox' || !t.listId);
                else if (f === 'today') {
                    filtered = state.tasks.filter(t => {
                        if(!t.completed) return t.startDate === today || (t.startDate <= today && t.endDate >= today) || (t.startDate < today);
                        // 已完成：今天完成的，或（旧任务无 completedDate）今天安排/跨今天的
                        return t.completedDate === today
                            || (!t.completedDate && (t.startDate === today || (t.startDate <= today && t.endDate >= today)));
                    });
                    grouped = true;
                }
                else if (f === 'next7') {
                    const wr = getWeekRange();
                    filtered = state.tasks.filter(t => {
                        if(!t.completed) return (t.startDate >= wr.start && t.startDate <= wr.end) || (t.startDate < today);
                        // 已完成：本周完成的，或（旧任务无 completedDate）本周安排的
                        return (t.completedDate && t.completedDate >= wr.start && t.completedDate <= wr.end)
                            || (!t.completedDate && t.startDate >= wr.start && t.startDate <= wr.end);
                    });
                    grouped = true;
                }
                else if (f?.startsWith('lst_')) filtered = state.tasks.filter(t => t.listId === f.substring(4));
                else if (f?.startsWith('tag_')) filtered = state.tasks.filter(t => t.tags.includes(f.substring(4)));
                else if (f?.startsWith('flt_')) {
                    const flt = state.filters.find(x => x.id === f.substring(4));
                    filtered = state.tasks.filter(t => {
                        const listMatch = flt.lists.length === 0 || flt.lists.includes(t.listId);
                        const tagMatch = flt.tags.length === 0 || t.tags.some(tg => flt.tags.includes(tg));
                        
                        let dateMatch = true;
                        if(flt.dateRange !== 'all') {
                            const rangeInfo = getStatDateRange(flt.dateRange, getTodayStr());
                            dateMatch = t.startDate >= rangeInfo.startStr && t.startDate <= rangeInfo.endStr;
                        }
                        return listMatch && tagMatch && dateMatch;
                    });
                } else filtered = state.tasks;

                if(filtered.length === 0) {
                    c.innerHTML = `<div class="text-center py-20 text-gray-300"><i class="fas fa-coffee text-4xl mb-3"></i><p class="text-sm">享受当下的宁静</p></div>`; return;
                }

                const buildHtml = (t) => {
                    const l = state.lists.find(x => x.id === t.listId);
                    const color = l ? l.color : '#9ca3af';
                    let tagsHtml = t.tags.map(tid => {
                        const tg = state.tags.find(x => x.id === tid);
                        return tg ? `<span class="text-[10px] px-1 rounded" style="color:${tg.color}; background:${tg.color}20">${tg.name}</span>` : '';
                    }).join('');
                    
                    let dateStr = '';
                    if(t.startDate) {
                        dateStr = t.startDate === today ? '今天' : t.startDate.slice(5);
                        if(t.startTime) dateStr += ` ${t.startTime}`;
                        if(t.endDate) dateStr += ` - ${t.endDate.slice(5)}${t.endTime ? ' '+t.endTime : ''}`;
                    }
                    const prioColor = t.priority === 'high' ? 'text-red-500' : (t.priority === 'medium' ? 'text-yellow-500' : (t.priority === 'low' ? 'text-blue-500' : 'hidden'));

                    return `
                        <div class="group flex items-start gap-3 py-2.5 px-2 -mx-2 rounded-lg hover:bg-gray-50 cursor-pointer transition border border-transparent ${state.editingTaskId === t.id ? '!bg-blue-50/50 !border-blue-100' : ''}" onclick="app.openTaskSidebar('${t.id}')">
                            <input type="checkbox" class="tk-checkbox mt-0.5" style="color: ${color}" ${t.completed?'checked':''} onclick="event.stopPropagation(); app.toggleTask('${t.id}')">
                            <div class="flex-1 min-w-0">
                                <div class="text-[14px] ${t.completed ? 'text-gray-400 line-through' : 'text-gray-800'} truncate">${t.title}</div>
                                <div class="flex items-center gap-2 mt-1 text-xs text-gray-400">
                                    ${dateStr ? `<span class="flex items-center gap-1 ${t.startDate < today && !t.completed ? 'text-red-400':''}"><i class="far fa-calendar-alt"></i>${dateStr}</span>` : ''}
                                    ${l ? `<span class="flex items-center gap-1"><i class="fas ${l.icon}" style="color:${l.color}"></i>${l.name}</span>` : ''}
                                    ${t.focusTime ? `<span class="flex items-center gap-1 text-orange-400" title="专注时间: ${t.focusTime}分钟"><i class="fas fa-stopwatch"></i>${t.focusTime}m</span>` : ''}
                                    ${tagsHtml}
                                    <i class="fas fa-flag ${prioColor}"></i>
                                </div>
                            </div>
                            <button class="text-gray-400 hover:text-red-500 active:text-red-600 transition p-1 -mr-1 shrink-0" onclick="event.stopPropagation(); app.deleteTask('${t.id}')" title="删除"><i class="far fa-trash-alt"></i></button>
                        </div>
                    `;
                };

                const un = filtered.filter(x => !x.completed);
                const co = filtered.filter(x => x.completed);

                let h = '';
                if(!grouped) {
                    h += un.map(buildHtml).join('');
                } else {
                    // Show overdue first
                    const overdue = un.filter(t => t.startDate && t.startDate < today);
                    if(overdue.length > 0) {
                        h += `<div class="mt-2 mb-1 font-bold text-red-500 text-sm border-b border-red-100 pb-1 flex items-center gap-1"><i class="fas fa-exclamation-circle text-xs"></i> 过期 <span class="text-red-300 font-normal ml-0.5">${overdue.length}</span></div>`;
                        h += overdue.map(buildHtml).join('');
                    }
                    const rest = un.filter(t => !t.startDate || t.startDate >= today);
                    const grp = {};
                    rest.forEach(t => { 
                        const d = t.startDate || '未定日期';
                        if(!grp[d]) grp[d]=[]; grp[d].push(t); 
                    });
                    Object.keys(grp).sort().forEach(d => {
                        let lbl = d === today ? '今天' : (d==='未定日期'?d:d.slice(5));
                        h += `<div class="mt-5 mb-1 font-bold text-gray-800 text-sm border-b border-gray-100 pb-1">${lbl} <span class="text-gray-400 font-normal ml-1">${grp[d].length}</span></div>` + grp[d].map(buildHtml).join('');
                    });
                }

                if(co.length > 0) {
                    // 最近完成的排前面，成就感满满
                    co.sort((a, b) => (b.completedDate || '0000-00-00').localeCompare(a.completedDate || '0000-00-00'));
                    h += `<div class="mt-8 mb-2 flex items-center gap-2 text-xs font-bold text-emerald-500 tracking-wider">
                            <div class="flex-1 border-t border-emerald-100"></div> 
                            <i class="fas fa-check-circle"></i> 已完成 <span class="text-emerald-300 font-normal ml-0.5">${co.length}</span>
                            <div class="flex-1 border-t border-emerald-100"></div>
                          </div>`;
                    h += co.map(buildHtml).join('');
                }

                c.innerHTML = h;
            },

            toggleTask(id) {
                const t = state.tasks.find(x => x.id === id);
                if(t) {
                    t.completed = !t.completed;
                    if(t.completed) { t.completedDate = getTodayStr(); } else { delete t.completedDate; }
                    this.refreshCurrentView(); this.updateCounts();
                }
                if(state.editingTaskId === id && document.getElementById('task-detail-sidebar').classList.contains('hidden') === false) {
                    document.getElementById('rs-check-btn').querySelector('i').className = t.completed ? 'fas fa-check-circle text-green-500 text-xl' : 'far fa-circle text-xl';
                }
            },

            openTaskSidebar(id) {
                state.editingTaskId = id;
                const t = state.tasks.find(x => x.id === id);
                if(!t) return;

                document.getElementById('rs-title').value = t.title;
                document.getElementById('rs-desc').value = t.description || '';
                document.getElementById('rs-start-date').value = t.startDate || '';
                document.getElementById('rs-start-time').value = t.startTime || '';
                document.getElementById('rs-end-date').value = t.endDate || '';
                document.getElementById('rs-end-time').value = t.endTime || '';
                document.getElementById('rs-check-btn').querySelector('i').className = t.completed ? 'fas fa-check-circle text-green-500 text-xl' : 'far fa-circle text-xl';

                const ls = document.getElementById('rs-list');
                ls.innerHTML = `<option value="inbox">收集箱</option>` + state.lists.filter(l=>!l.archived).map(l => `<option value="${l.id}">${l.name}</option>`).join('');
                ls.value = t.listId || 'inbox';

                const ts = document.getElementById('rs-tags');
                ts.innerHTML = state.tags.map(tg => `
                    <label class="flex items-center gap-1 text-xs border rounded px-1.5 py-0.5 cursor-pointer transition ${t.tags.includes(tg.id)?'bg-gray-100 border-gray-300':''}">
                        <input type="checkbox" class="hidden rs-tag-cb" value="${tg.id}" ${t.tags.includes(tg.id)?'checked':''} onchange="app.saveCurrentTask()">
                        <span style="color:${tg.color}"># ${tg.name}</span>
                    </label>
                `).join('');

                this.setPriority(t.priority || 'none', false);

                const rs = document.getElementById('task-detail-sidebar');
                rs.classList.remove('hidden'); void rs.offsetWidth; rs.classList.remove('translate-x-full');
                document.getElementById('task-detail-backdrop').classList.remove('hidden');
                
                if(state.currentView === 'view-tasks') this.renderTasks(); 
            },

            closeTaskSidebar() {
                const rs = document.getElementById('task-detail-sidebar');
                rs.classList.add('translate-x-full');
                document.getElementById('task-detail-backdrop').classList.add('hidden');
                setTimeout(() => rs.classList.add('hidden'), 300);
                state.editingTaskId = null;
                if(state.currentView === 'view-tasks') this.renderTasks();
            },

            saveCurrentTask() {
                if(!state.editingTaskId) return;
                const t = state.tasks.find(x => x.id === state.editingTaskId);
                t.title = document.getElementById('rs-title').value.trim() || '未命名';
                t.description = document.getElementById('rs-desc').value.trim();
                t.startDate = document.getElementById('rs-start-date').value || null;
                t.startTime = document.getElementById('rs-start-time').value || null;
                t.endDate = document.getElementById('rs-end-date').value || null;
                t.endTime = document.getElementById('rs-end-time').value || null;
                t.listId = document.getElementById('rs-list').value;
                t.tags = Array.from(document.querySelectorAll('.rs-tag-cb:checked')).map(cb => cb.value);
                
                this.refreshCurrentView(); this.updateCounts();
            },

            setPriority(val, save = true) {
                document.querySelectorAll('.rs-priority').forEach(b => b.classList.remove('ring-2', 'ring-offset-1', 'ring-gray-200'));
                document.querySelector(`.rs-priority[data-val="${val}"]`).classList.add('ring-2', 'ring-offset-1', 'ring-gray-200');
                if(save && state.editingTaskId) { state.tasks.find(x => x.id === state.editingTaskId).priority = val; this.saveCurrentTask(); }
            },
            toggleCurrentTask() { if(state.editingTaskId) this.toggleTask(state.editingTaskId); },
            deleteCurrentTask() {
                if(!state.editingTaskId) return;
                state.tasks = state.tasks.filter(x => x.id !== state.editingTaskId);
                this.closeTaskSidebar(); this.updateCounts(); this.refreshCurrentView();
            },
            deleteTask(id) {
                const t = state.tasks.find(x => x.id === id);
                if(!t) return;
                if(!confirm('确定删除「' + t.title + '」？')) return;
                state.tasks = state.tasks.filter(x => x.id !== id);
                if(state.editingTaskId === id) this.closeTaskSidebar();
                this.updateCounts(); this.refreshCurrentView();
            },

            // --- Custom Month Picker Logic ---
            openMonthPicker(e) {
                if(e) e.stopPropagation();
                const drop = document.getElementById('month-picker-dropdown');
                if(!drop.classList.contains('hidden')) {
                    drop.classList.add('hidden'); return;
                }
                this.pickerYear = state.calCurrentDate.getFullYear();
                document.getElementById('picker-year-display').innerText = this.pickerYear;
                this.renderPickerMonths();
                drop.classList.remove('hidden');
            },
            
            changePickerYear(delta) {
                this.pickerYear += delta;
                document.getElementById('picker-year-display').innerText = this.pickerYear;
                this.renderPickerMonths();
            },
            
            renderPickerMonths() {
                const grid = document.getElementById('picker-months-grid');
                const currentM = state.calCurrentDate.getMonth();
                const currentY = state.calCurrentDate.getFullYear();
                let html = '';
                for(let i=0; i<12; i++) {
                    const isActive = (i === currentM && this.pickerYear === currentY);
                    html += `<button class="py-2 text-[13px] rounded-md transition ${isActive ? 'bg-blue-500 text-white font-bold shadow-md' : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900'}" onclick="app.selectPickerMonth(${i})">${i+1}月</button>`;
                }
                grid.innerHTML = html;
            },
            
            selectPickerMonth(m) {
                state.calCurrentDate = new Date(this.pickerYear, m, 1);
                document.getElementById('month-picker-dropdown').classList.add('hidden');
                this.renderCalendar();
            },

            setCalMode(mode) {
                state.calViewMode = mode;
                this.renderCalendar();
            },
            changeMonth(delta) {
                if (state.calViewMode === 'two-weeks') {
                    state.calCurrentDate.setDate(state.calCurrentDate.getDate() + delta * 14);
                } else {
                    state.calCurrentDate.setMonth(state.calCurrentDate.getMonth() + delta);
                }
                this.renderCalendar();
            },
            goToday() {
                state.calCurrentDate = new Date();
                this.renderCalendar();
            },
            toggleCalQuickMultiDay() {
                const type = document.getElementById('cal-quick-day-type').value;
                const wrapper = document.getElementById('cal-quick-end-date-wrapper');
                if (type === 'multi') wrapper.classList.remove('hidden'); else wrapper.classList.add('hidden');
                wrapper.style.display = type === 'multi' ? 'flex' : '';
            },
            toggleCalQuickTime() {
                const type = document.getElementById('cal-quick-time-type').value;
                const st = document.getElementById('cal-quick-start-time');
                const et = document.getElementById('cal-quick-end-time');
                const sep = document.getElementById('cal-quick-time-sep');
                if (type === 'none') { st.classList.add('hidden'); et.classList.add('hidden'); sep.classList.add('hidden'); } 
                else if (type === 'time') { st.classList.remove('hidden'); et.classList.add('hidden'); sep.classList.add('hidden'); } 
                else if (type === 'range') { st.classList.remove('hidden'); et.classList.remove('hidden'); sep.classList.remove('hidden'); }
            },
            
            newTaskFromDayPanel() {
                const dateStr = state.dayPanelDate || getTodayStr();
                modals.closeAll();
                setTimeout(() => modals.openCalQuickModal(dateStr), 220);
            },
            toggleCalQuickCurrentTask() {
                if(state.editingTaskId) {
                    this.toggleTask(state.editingTaskId);
                    const t = state.tasks.find(x => x.id === state.editingTaskId);
                    const btn = document.getElementById('cal-quick-check-btn');
                    const icn = document.getElementById('cal-quick-check-icon');
                    if(t && t.completed) {
                        btn.classList.add('completed');
                        icn.className = 'fas fa-check-circle text-green-500 text-xl';
                    } else {
                        btn.classList.remove('completed');
                        icn.className = 'far fa-circle text-xl';
                    }
                }
            },

            saveCalQuick() {
                const title = document.getElementById('cal-quick-title').value.trim();
                const desc = document.getElementById('cal-quick-desc').value.trim();
                const date = document.getElementById('cal-quick-date').value;
                const dayType = document.getElementById('cal-quick-day-type').value;
                const endDate = dayType === 'multi' ? document.getElementById('cal-quick-end-date').value : null;
                const timeType = document.getElementById('cal-quick-time-type').value;
                const startTime = (timeType === 'time' || timeType === 'range') ? document.getElementById('cal-quick-start-time').value : null;
                const endTime = timeType === 'range' ? document.getElementById('cal-quick-end-time').value : null;
                const listId = document.getElementById('cal-quick-list').value;
                const priority = document.getElementById('cal-quick-priority').value;
                const tags = Array.from(document.querySelectorAll('.cal-quick-tag-cb:checked')).map(cb => cb.value);
                
                if(!title) return;

                if(state.editingTaskId) {
                    const t = state.tasks.find(x=>x.id===state.editingTaskId);
                    t.title = title; t.description = desc; t.startDate = date; t.endDate = endDate;
                    t.startTime = startTime; t.endTime = endTime; t.listId = listId; t.priority = priority; t.tags = tags;
                } else {
                    state.tasks.push({
                        id: 'tk'+Date.now(), title, description: desc, listId, 
                        startDate: date, startTime, endDate, endTime, 
                        completed: false, tags: tags, priority: priority, created: getTodayStr(), focusTime: 0
                    });
                }
                const reopenDayPanel = app._dayPanelContext && state.dayPanelDate;
                modals.closeAll(); this.renderCalendar(); this.updateCounts();
                if(reopenDayPanel) setTimeout(() => modals.openDayPanel(state.dayPanelDate), 220);
            },

            deleteCalQuickTask() {
                if(!state.editingTaskId) return;
                state.tasks = state.tasks.filter(x => x.id !== state.editingTaskId);
                const reopenDayPanel = app._dayPanelContext && state.dayPanelDate;
                modals.closeAll(); this.renderCalendar(); this.updateCounts();
                if(reopenDayPanel) setTimeout(() => modals.openDayPanel(state.dayPanelDate), 220);
            },

            // --- Calendar list/folder filter ---
            toggleCalFilter() {
                const dd = document.getElementById('cal-filter-dropdown');
                if(!dd.classList.contains('hidden')) { dd.classList.add('hidden'); return; }
                this.renderCalFilterDropdown();
                dd.classList.remove('hidden');
                // Close on outside click
                setTimeout(() => {
                    document.addEventListener('click', this._calFilterOutside, { once: true });
                }, 0);
            },
            _calFilterOutside(e) {
                const wrapper = document.getElementById('cal-filter-wrapper');
                if(wrapper && !wrapper.contains(e.target)) {
                    document.getElementById('cal-filter-dropdown').classList.add('hidden');
                } else {
                    // Re-register if clicked inside (dropdown stays open)
                    document.addEventListener('click', app._calFilterOutside, { once: true });
                }
            },
            renderCalFilterDropdown() {
                const dd = document.getElementById('cal-filter-dropdown');
                const cur = state.calListFilter || 'all';
                let html = '';
                // All
                html += `<button onclick="app.setCalListFilter('all')" class="w-full flex items-center gap-2 px-2.5 py-2 rounded-lg text-xs font-medium transition ${cur==='all'?'bg-blue-50 text-blue-600':'text-gray-600 hover:bg-gray-50'}">
                    <i class="fas fa-layer-group w-4 text-center text-gray-400"></i> 全部清单
                </button>`;
                // Inbox
                html += `<button onclick="app.setCalListFilter('inbox')" class="w-full flex items-center gap-2 px-2.5 py-2 rounded-lg text-xs font-medium transition ${cur==='inbox'?'bg-blue-50 text-blue-600':'text-gray-600 hover:bg-gray-50'}">
                    <i class="fas fa-inbox w-4 text-center text-gray-400"></i> 收集箱
                </button>`;
                // Lists without folder
                const noFolderLists = state.lists.filter(l => !l.folderId && !l.archived);
                if(noFolderLists.length > 0) {
                    html += '<div class="border-t border-gray-100 my-1"></div>';
                    noFolderLists.forEach(l => {
                        const active = cur === l.id;
                        html += `<button onclick="app.setCalListFilter('${l.id}')" class="w-full flex items-center gap-2 px-2.5 py-2 rounded-lg text-xs font-medium transition ${active?'bg-blue-50 text-blue-600':'text-gray-600 hover:bg-gray-50'}">
                            <i class="fas ${l.icon||'fa-list-ul'} w-4 text-center" style="color:${l.color||'#9ca3af'}"></i> ${l.name}
                        </button>`;
                    });
                }
                // Folders with their lists
                state.folders.forEach(fd => {
                    const fdLists = state.lists.filter(l => l.folderId === fd.id && !l.archived);
                    if(fdLists.length === 0) return;
                    const folderActive = cur === 'folder:'+fd.id;
                    html += '<div class="border-t border-gray-100 my-1"></div>';
                    // Folder header (click to filter by all lists in folder)
                    html += `<button onclick="app.setCalListFilter('folder:${fd.id}')" class="w-full flex items-center gap-2 px-2.5 py-2 rounded-lg text-xs font-bold transition ${folderActive?'bg-blue-50 text-blue-600':'text-gray-700 hover:bg-gray-50'}">
                        <i class="fas fa-folder w-4 text-center text-gray-400"></i> ${fd.name}
                    </button>`;
                    // Individual lists under folder
                    fdLists.forEach(l => {
                        const active = cur === l.id;
                        html += `<button onclick="app.setCalListFilter('${l.id}')" class="w-full flex items-center gap-2 pl-7 pr-2.5 py-1.5 rounded-lg text-xs font-medium transition ${active?'bg-blue-50 text-blue-600':'text-gray-500 hover:bg-gray-50'}">
                            <i class="fas ${l.icon||'fa-list-ul'} w-4 text-center" style="color:${l.color||'#9ca3af'}"></i> ${l.name}
                        </button>`;
                    });
                });
                dd.innerHTML = html;
            },
            setCalListFilter(val) {
                state.calListFilter = val;
                // Update label
                let label = '全部清单';
                if(val === 'inbox') label = '收集箱';
                else if(val.startsWith('folder:')) {
                    const fd = state.folders.find(x => x.id === val.slice(7));
                    label = fd ? '📁 '+fd.name : '全部清单';
                } else if(val !== 'all') {
                    const l = state.lists.find(x => x.id === val);
                    label = l ? l.name : '全部清单';
                }
                const lbl = document.getElementById('cal-filter-label');
                if(lbl) lbl.textContent = label;
                document.getElementById('cal-filter-dropdown').classList.add('hidden');
                this.renderCalendar();
            },
            _getCalFilteredTasks(ds) {
                let tasks = state.tasks.filter(t => ((t.startDate === ds) || (t.startDate <= ds && t.endDate >= ds)));
                const f = state.calListFilter || 'all';
                if(f === 'all') return tasks;
                if(f === 'inbox') return tasks.filter(t => !t.listId);
                if(f.startsWith('folder:')) {
                    const fdId = f.slice(7);
                    const listIds = state.lists.filter(l => l.folderId === fdId).map(l => l.id);
                    return tasks.filter(t => t.listId && listIds.includes(t.listId));
                }
                return tasks.filter(t => t.listId === f);
            },

            renderCalendar() {
                const grid = document.getElementById('calendar-grid');
                grid.innerHTML = '';
                const today = new Date(); const tStr = getTodayStr();
                const mode = state.calViewMode || 'month';
                
                const btnMonth = document.getElementById('cal-mode-month');
                const btnTwoWeeks = document.getElementById('cal-mode-two-weeks');
                if(btnMonth) btnMonth.className = `px-3 h-6 text-xs rounded font-medium transition ${mode === 'month' ? 'bg-white shadow-sm text-blue-600' : 'text-gray-700 hover:bg-white/50'}`;
                if(btnTwoWeeks) btnTwoWeeks.className = `px-3 h-6 text-xs rounded font-medium transition ${mode === 'two-weeks' ? 'bg-white shadow-sm text-blue-600' : 'text-gray-700 hover:bg-white/50'}`;

                let y = state.calCurrentDate.getFullYear(); 
                let m = state.calCurrentDate.getMonth();
                
                let d = new Date(state.calCurrentDate);
                let daysToRender = 35;
                
                if (mode === 'month') {
                    document.getElementById('calendar-month-title').innerHTML = `${y}年 ${m+1}月 <i class="fas fa-caret-down text-sm opacity-30 group-hover:opacity-100 transition-opacity"></i>`;
                    
                    d = new Date(y, m, 1);
                    const fd = d.getDay(); 
                    const startOff = fd === 0 ? 6 : fd - 1;
                    d.setDate(d.getDate() - startOff);
                    
                    const daysInMonth = new Date(y, m+1, 0).getDate();
                    daysToRender = (startOff + daysInMonth) > 35 ? 42 : 35;
                    grid.style.gridTemplateRows = `repeat(${daysToRender/7}, minmax(0, 1fr))`;
                } else {
                    const day = d.getDay();
                    const startOff = day === 0 ? 6 : day - 1;
                    d.setDate(d.getDate() - startOff);
                    
                    const midWeek = new Date(d);
                    midWeek.setDate(d.getDate() + 6); // 取双周的中间作为展示月份
                    document.getElementById('calendar-month-title').innerHTML = `${midWeek.getFullYear()}年 ${midWeek.getMonth()+1}月 <i class="fas fa-caret-down text-sm opacity-30 group-hover:opacity-100 transition-opacity"></i>`;
                    
                    daysToRender = 14;
                    grid.style.gridTemplateRows = `repeat(2, minmax(0, 1fr))`;
                }

                let html = '';
                for(let i=0; i<daysToRender; i++) {
                    const ds = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split('T')[0];
                    const isM = mode === 'two-weeks' ? true : d.getMonth() === m; 
                    const isT = ds === tStr;
                    
                    const tasks = this._getCalFilteredTasks(ds);
                    tasks.sort((a, b) => (a.completed === b.completed) ? 0 : a.completed ? 1 : -1);
                    
                    const displayTasks = mode === 'month' ? tasks.slice(0, 3) : tasks;
                    const hasMore = mode === 'month' && tasks.length > 3;

                    html += `
                        <div class="border-r border-b border-white/60 p-1 flex flex-col h-full relative group cursor-pointer ${isM ? 'bg-white/40 hover:bg-white/70' : 'bg-black/5 hover:bg-black/10'}" onclick="modals.openDayPanel('${ds}')">
                            <div class="flex justify-between items-start px-1 mb-1 shrink-0">
                                <span class="text-[11px] font-medium ${isT ? 'bg-[#6a8b9e] text-white w-5 h-5 flex items-center justify-center rounded-full shadow-sm' : (isM ? 'text-gray-700' : 'text-gray-400/60')}">${d.getDate() === 1 ? (d.getMonth()+1)+'月' : d.getDate()}</span>
                                <button onclick="event.stopPropagation(); app._dayPanelContext=false; modals.openCalQuickModal('${ds}')" class="opacity-0 group-hover:opacity-100 text-gray-300 hover:text-blue-500 w-4 h-4 flex items-center justify-center" title="新建任务"><i class="fas fa-plus text-[8px]"></i></button>
                            </div>
                            <div class="flex-1 ${mode==='two-weeks'?'overflow-y-auto':'overflow-hidden'} no-scrollbar space-y-0.5 relative z-10 mt-0.5">
                                ${displayTasks.map(t => {
                                    const l = state.lists.find(x => x.id === t.listId);
                                    const col = l ? l.color : '#9ca3af';
                                    const isSpan = t.startDate !== t.endDate && t.endDate;
                                    const isCompleted = t.completed;
                                    
                                    if(isSpan) {
                                        return `<div class="text-[10px] px-1 py-0.5 rounded text-white truncate flex items-center gap-1.5" style="background:${isCompleted ? '#d1d5db' : col}" onclick="event.stopPropagation(); modals.openCalQuickModal('${ds}', '${t.id}')">
                                            <div onclick="event.stopPropagation(); app.toggleTask('${t.id}')" class="flex items-center justify-center shrink-0 w-[12px] h-[12px] rounded-[3px] border cursor-pointer" style="border-color: rgba(255,255,255,0.7); background: ${isCompleted ? 'rgba(255,255,255,0.2)' : 'transparent'}">
                                                ${isCompleted ? '<i class="fas fa-check text-[8px] text-white"></i>' : ''}
                                            </div>
                                            <span class="${isCompleted ? 'line-through opacity-80' : ''}">${t.title}</span>
                                        </div>`;
                                    } else {
                                        return `
                                        <div class="flex items-center gap-1.5 rounded hover:bg-white/60 px-1 py-0.5 group/item" onclick="event.stopPropagation(); modals.openCalQuickModal('${ds}', '${t.id}')">
                                            <div onclick="event.stopPropagation(); app.toggleTask('${t.id}')" class="flex items-center justify-center shrink-0 w-[12px] h-[12px] rounded-[3px] border cursor-pointer" style="border-color: ${isCompleted ? '#9ca3af' : col}; background: ${isCompleted ? '#9ca3af' : 'transparent'}">
                                                ${isCompleted ? '<i class="fas fa-check text-[8px] text-white"></i>' : ''}
                                            </div>
                                            <span class="text-[10px] ${isCompleted ? 'text-gray-400 line-through' : 'text-gray-700'} ${mode==='two-weeks'?'whitespace-normal leading-tight break-words':'truncate'}" style="${isCompleted ? '' : 'color:'+col}">${t.startTime?t.startTime+' ':''}${t.title}</span>
                                        </div>`;
                                    }
                                }).join('')}
                                ${hasMore ? `<div onclick="event.stopPropagation(); modals.openDayPanel('${ds}')" class="text-[10px] text-blue-400 hover:text-blue-600 px-1 font-medium mt-1 cursor-pointer">+${tasks.length-3} 项 · 查看全部</div>` : ''}
                            </div>
                        </div>
                    `;
                    d.setDate(d.getDate() + 1);
                }
                grid.innerHTML = html;
                this.saveState();
            },

            // --- Habits ---
            switchHabitTab(btn, viewMode) {
                document.querySelectorAll('.hb-tab-btn').forEach(b => b.className = 'px-3 py-1 rounded text-gray-500 hover:text-gray-800 transition hb-tab-btn');
                btn.className = 'px-3 py-1 rounded bg-white shadow-sm font-medium text-gray-900 transition hb-tab-btn';
                this.refreshHabitDetail();
            },
            refreshHabitDetail() {
                const hId = document.getElementById('habit-detail-view').dataset.habitId;
                if(hId) {
                    const activeBtn = document.querySelector('.hb-tab-btn.text-gray-900');
                    const mode = activeBtn ? (activeBtn.innerText === '年' ? 'year' : (activeBtn.innerText === '季' ? 'quarter' : (activeBtn.innerText === '月' ? 'month' : 'week'))) : 'week';
                    this.renderHabitHeatmap(hId, mode);
                }
            },
            saveHabit() {
                const n = document.getElementById('habit-edit-name').value.trim();
                const f = document.getElementById('habit-edit-frequency').value;
                if(!n) return;
                
                if(state.editingHabitId) {
                    const h = state.habits.find(x=>x.id === state.editingHabitId);
                    h.name = n; h.frequency = f;
                } else {
                    state.habits.push({id:'hb'+Date.now(), name:n, icon:'fa-star', frequency: f, logs:{}});
                }
                this.renderHabits();
                modals.closeAll();
            },
            deleteHabit() {
                if(!state.editingHabitId) return;
                state.habits = state.habits.filter(x => x.id !== state.editingHabitId);
                document.getElementById('habit-detail-view').classList.add('hidden');
                this.renderHabits();
                modals.closeAll();
            },
            renderHabits() {
                const c = document.getElementById('habit-list-container');
                const today = getTodayStr();
                let todayTotal = 0; let todayDone = 0;
                const currentDay = new Date().getDay(); 
                
                state.habits.forEach(h => {
                    let shouldDoToday = true;
                    if(h.frequency === 'workday' && (currentDay === 0 || currentDay === 6)) shouldDoToday = false;
                    if(h.frequency === 'weekend' && (currentDay !== 0 && currentDay !== 6)) shouldDoToday = false;
                    
                    if(shouldDoToday) {
                        todayTotal++;
                        if(h.logs[today]) todayDone++;
                    }
                });

                const freqMap = { 'daily': '每天', 'workday': '工作日', 'weekend': '周末' };
                const pct = todayTotal ? (todayDone/todayTotal*100) : 0;
                
                let dashboardHtml = `
                    <div class="md:col-span-2 bg-gradient-to-r from-emerald-500 to-teal-400 rounded-2xl p-6 text-white shadow-lg mb-2 flex justify-between items-center relative overflow-hidden">
                        <div class="absolute -right-10 -bottom-10 text-white/10 text-9xl pointer-events-none"><i class="fas fa-leaf"></i></div>
                        <div class="relative z-10">
                            <div class="text-emerald-100 text-sm mb-1.5 font-medium tracking-wider uppercase">TODAY / 今日进度</div>
                            <div class="text-4xl font-black tracking-tight drop-shadow-sm">${todayDone} <span class="text-2xl font-medium text-emerald-100/80">/ ${todayTotal}</span></div>
                        </div>
                        <div class="w-20 h-20 relative z-10 drop-shadow-md">
                            <svg viewBox="0 0 36 36" class="w-full h-full transform -rotate-90">
                                <path class="text-emerald-700/30" stroke-width="4" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                <path class="text-white transition-all duration-1000 ease-out" stroke-dasharray="${pct}, 100" stroke-width="4" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            </svg>
                        </div>
                    </div>
                `;

                c.innerHTML = dashboardHtml + state.habits.map(h => `
                    <div class="bg-white border border-gray-100 rounded-xl p-4 shadow-sm hover:shadow-md transition cursor-pointer flex justify-between items-center relative group" onclick="app.showHabitDetail('${h.id}')">
                        <div class="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition z-20">
                            <button class="w-6 h-6 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-500" onclick="event.stopPropagation(); modals.openHabitModal('${h.id}')"><i class="fas fa-pen text-[10px]"></i></button>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-lg bg-green-50 text-green-500 flex items-center justify-center text-xl"><i class="fas ${h.icon}"></i></div>
                            <div>
                                <div class="font-bold text-gray-800">${h.name}</div>
                                <div class="text-[10px] text-gray-400 flex gap-2 items-center mt-1">
                                    <span class="bg-gray-100 px-1.5 py-0.5 rounded text-gray-500 font-medium">${freqMap[h.frequency] || '每天'}</span>
                                    <div class="flex gap-1">
                                        ${[3,2,1,0].map(off => `<div class="w-3 h-3 rounded-sm ${h.logs[getDateStr(-off)]?'bg-green-400':'bg-gray-100'}" title="${getDateStr(-off)}"></div>`).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button class="w-8 h-8 rounded-full border border-gray-200 text-gray-300 hover:text-white hover:bg-green-500 hover:border-green-500 transition flex items-center justify-center shadow-sm z-10" onclick="event.stopPropagation(); app.punchHabit('${h.id}')"><i class="fas fa-check text-xs"></i></button>
                    </div>
                `).join('');
                this.saveState();
            },
            punchHabit(id) {
                const h = state.habits.find(x=>x.id===id); h.logs[getTodayStr()] = true; this.renderHabits();
                if(!document.getElementById('habit-detail-view').classList.contains('hidden')) {
                    this.refreshHabitDetail();
                }
            },
            showHabitDetail(id) {
                const h = state.habits.find(x=>x.id===id);
                document.getElementById('heat-title').innerHTML = `<i class="fas ${h.icon} text-green-500"></i> ${h.name} 打卡记录`;
                document.getElementById('habit-detail-view').classList.remove('hidden');
                document.getElementById('habit-detail-view').dataset.habitId = id;
                document.querySelectorAll('.hb-tab-btn').forEach(b => b.className = 'px-3 py-1 rounded text-gray-500 hover:text-gray-800 transition hb-tab-btn');
                document.querySelector('.hb-tab-btn').className = 'px-3 py-1 rounded bg-white shadow-sm font-medium text-gray-900 transition hb-tab-btn';
                this.refreshHabitDetail();
            },
            renderHabitHeatmap(id, viewMode) {
                const h = state.habits.find(x=>x.id===id);
                const c = document.getElementById('habit-heatmap-container');
                let html = ''; 
                
                const refDateStr = document.getElementById('habit-ref-date').value || getTodayStr();
                const rangeInfo = getStatDateRange(viewMode, refDateStr);

                if(viewMode === 'week' || viewMode === 'month') {
                    html = '<div class="flex flex-wrap gap-2.5 w-full">';
                    let d = new Date(rangeInfo.startDate);
                    while(d <= rangeInfo.endDate) {
                        let ds = d.toISOString().split('T')[0];

            // --- Pomodoro Module ---
            initPomodoro() {
                document.querySelectorAll('.focus-tab').forEach(b => {
                    b.onclick = (e) => {
                        document.querySelectorAll('.focus-tab').forEach(x=>x.className='px-5 py-1.5 rounded-md text-white/50 hover:text-white/80 text-sm transition focus-tab');
                        e.target.className = 'px-5 py-1.5 rounded-md bg-white/10 text-white text-sm font-medium transition focus-tab active border border-white/20';
                        state.focus.mode = e.target.dataset.mode;
                        this.resetFocus();
                    }
                });

                document.getElementById('focus-play-btn').onclick = () => {
                    const btn = document.getElementById('focus-play-btn');
                    const icn = btn.querySelector('i');
                    const st = document.getElementById('focus-status-text');

                    if(state.focus.active) {
                        clearInterval(state.focus.timer); state.focus.active = false;
                        icn.className = 'fas fa-play ml-1'; st.innerText = 'PAUSED';
                        btn.className = 'w-16 h-16 rounded-full bg-blue-500 hover:bg-blue-600 flex items-center justify-center text-2xl shadow-[0_0_30px_rgba(59,130,246,0.3)] transition transform hover:scale-105 text-white';
                    } else {
                        state.focus.active = true;
                        icn.className = 'fas fa-pause'; st.innerText = 'FOCUSING...';
                        btn.className = 'w-16 h-16 rounded-full bg-red-500 hover:bg-red-600 flex items-center justify-center text-2xl shadow-[0_0_30px_rgba(239,68,68,0.3)] transition transform hover:scale-105 text-white';
                        
                        state.focus.timer = setInterval(() => {
                            if(state.focus.mode === 'pomodoro') {
                                if(state.focus.timeLeft > 0) state.focus.timeLeft--;
                                else { this.resetFocus(); this.addFocusTimeToTask(); }
                            } else { state.focus.timeLeft++; }
                            
                            state.focus.sessionElapsed++;
                            if(state.focus.sessionElapsed > 0 && state.focus.sessionElapsed % 60 === 0) this.addFocusTimeToTask(1);
                            this.updateFocusUI();
                        }, 1000);
                    }
                };
            },

            initPomodoroDrag() {
                const display = document.getElementById('focus-time-display');
                let isDragging = false;
                let startY = 0; let startMins = 0;

                const startDrag = (e) => {
                    if(state.focus.active || state.focus.mode !== 'pomodoro') return;
                    isDragging = true;
                    startY = e.touches ? e.touches[0].clientY : e.clientY;
                    startMins = state.focus.durationMinutes;
                    display.style.cursor = 'grabbing';
                };
                
                const onDrag = (e) => {
                    if(!isDragging) return;
                    e.preventDefault(); 
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    const deltaY = startY - clientY; 
                    let newMins = startMins + Math.floor(deltaY / 4); 
                    newMins = Math.max(1, Math.min(120, newMins)); 
                    if(newMins !== state.focus.durationMinutes) {
                        state.focus.durationMinutes = newMins;
                        this.resetFocus();
                    }
                };
                
                const stopDrag = (e) => {
                    if(isDragging) {
                        isDragging = false; display.style.cursor = '';
                        const endY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
                        if(Math.abs(startY - endY) < 3) this.promptFocusDuration();
                    }
                };

                display.addEventListener('mousedown', startDrag);
                window.addEventListener('mousemove', onDrag, {passive: false});
                window.addEventListener('mouseup', stopDrag);
                
                display.addEventListener('touchstart', startDrag, {passive: false});
                window.addEventListener('touchmove', onDrag, {passive: false});
                window.addEventListener('touchend', stopDrag);
            },
            
            promptFocusDuration() {
                if(state.focus.active || state.focus.mode !== 'pomodoro') return;
                const min = prompt("请设置专注时长 (1-120 分钟):", state.focus.durationMinutes);
                if(min && !isNaN(min) && min > 0) {
                    state.focus.durationMinutes = parseInt(min);
                    this.resetFocus();
                }
            },
            
            addFocusTimeToTask(minutes = 0) {
                if(state.focus.taskId) {
                    const t = state.tasks.find(x => x.id === state.focus.taskId);
                    if(t) {
                        t.focusTime = (t.focusTime || 0) + minutes;
                        if(state.currentView === 'view-tasks') this.renderTasks();
                        this.saveState();
                    }
                }
            },
            
            resetFocus() {
                clearInterval(state.focus.timer); state.focus.active = false; state.focus.sessionElapsed = 0;
                state.focus.timeLeft = state.focus.mode === 'pomodoro' ? state.focus.durationMinutes * 60 : 0;
                
                document.getElementById('focus-status-text').innerText = 'READY';
                const btn = document.getElementById('focus-play-btn');
                btn.querySelector('i').className = 'fas fa-play ml-1';
                btn.className = 'w-16 h-16 rounded-full bg-blue-500 hover:bg-blue-600 flex items-center justify-center text-2xl shadow-[0_0_30px_rgba(59,130,246,0.3)] transition transform hover:scale-105 text-white';
                this.updateFocusUI();

            updateFocusUI() {
