<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>健康管理</title>
<link rel="stylesheet" href="tailwind.css">
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
<style>
  body { -webkit-tap-highlight-color: transparent; }
  .view-section { display: none; }
  .view-section.active { display: block; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .fade-in { animation: fade .35s ease; }
  @keyframes fade { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
  .toast { animation: fade .3s ease; }
  .cup-btn { transition: all .15s ease; }
  .cup-btn:active { transform: scale(0.9); }
  .food-item { transition: all .15s; }
  .food-item:active { transform: scale(0.98); }
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .range-btn { transition: all .15s; }
  .range-btn.active { background: #0d9488; color: #fff; }
  .qp-item { cursor: grab; transition: all .15s; }
  .qp-item.dragging { opacity: .4; }
  .qp-item.drag-over { border-color: #0d9488; }
  .heat-cell { border-radius: 3px; transition: transform .1s; }
  .heat-cell:active { transform: scale(1.3); }
  /* ===== Cycle / 生理周期 ===== */
  .cycle-tab.active { background: #e11d48; color: #fff; }
  .cyc-day { width: 100%; aspect-ratio: 1/1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius: 10px; position:relative; font-size: 12px; line-height:1; }
  .cyc-period { background:#fecdd3; color:#9f1239; font-weight:700; }
  .cyc-period-first { background:#e11d48; color:#fff; font-weight:700; }
  .cyc-predict { background:#fff; color:#e11d48; border:1.5px dashed #f43f5e; font-weight:700; }
  .cyc-fertile { background:#dbeafe; color:#1d4ed8; font-weight:600; }
  .cyc-ovu { background:#2563eb; color:#fff; font-weight:800; }
  .cyc-other { background:#f8fafc; color:#94a3b8; }
  .cyc-today { outline: 2px solid #0f172a; outline-offset: -2px; }
  .cyc-chip { transition: all .15s; }
  .cyc-chip.sel { background:#e11d48; color:#fff; border-color:#e11d48; }
  .cyc-legend { display:flex; flex-wrap:wrap; gap:10px; }
  .cyc-legend i { width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:middle; }
  .cyc-toggle { width:44px; height:24px; border-radius:12px; background:#e2e8f0; position:relative; transition:background .2s; flex-shrink:0; }
  .cyc-toggle.on { background:#f43f5e; }
  .cyc-toggle .knob { position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2); transition:left .2s; }
  .cyc-toggle.on .knob { left:22px; }
  .cyc-action-row { display:flex; align-items:center; gap:12px; padding:13px 16px; cursor:pointer; transition:background .1s; position:relative; }
  .cyc-action-row:active { background:#f8fafc; }
  .cyc-action-row + .cyc-action-row { border-top:1px solid #f1f5f9; }
  .cyc-action-row.has-log { background: linear-gradient(90deg, #fff1f2 0%, #ffffff 40%); }
  .cyc-action-row.has-log::before { content:''; position:absolute; left:0; top:8px; bottom:8px; width:3px; background:#f43f5e; border-radius:0 2px 2px 0; }
  .cyc-action-row .ic { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .cyc-action-row .ic.rose { background:#ffe4e6; color:#e11d48; }
  .cyc-action-row .ic.purple { background:#ede9fe; color:#7c3aed; }
  .cyc-action-row .ic.amber { background:#fef3c7; color:#d97706; }
  .cyc-action-row .ic.slate { background:#e0f2fe; color:#0284c7; }
  .cyc-action-row .lbl { flex:1; font-size:14px; font-weight:500; color:#334155; }
  .cyc-action-row .ic-logged { color:#e11d48; font-size:18px; line-height:1; }
  .cyc-action-row .ic-arrow { color:#cbd5e1; font-size:18px; line-height:1; }
  .cyc-droplet { font-size:24px; transition: all .15s; }
  .cyc-bolt { font-size:20px; transition: all .15s; }
  .cyc-droplet.dim, .cyc-bolt.dim { opacity:0.18; filter:grayscale(1); }
  .cyc-datebar { display:flex; align-items:center; gap:8px; padding:8px 14px; background:#f8fafc; border-bottom:1px solid #f1f5f9; }
  .cyc-datebar .label { font-size:11px; font-weight:700; color:#94a3b8; text-transform:uppercase; letter-spacing:0.5px; }
  .cyc-datebar .nav-btn { width:26px; height:26px; border-radius:50%; background:#fff; color:#94a3b8; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .cyc-datebar .date { font-size:13px; font-weight:700; color:#334155; min-width:90px; text-align:center; }
  .cyc-datebar .today-btn { font-size:10px; font-weight:700; padding:3px 8px; border-radius:10px; background:#ffe4e6; color:#e11d48; }
  .cyc-datebar .today-btn.active { background:#e11d48; color:#fff; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">

<!-- Header -->
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-100 px-4 py-3">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-lg font-black text-slate-800">💪 健康管理</h1>
      <p class="text-[11px] text-slate-400" id="header-date"></p>
    </div>
    <button onclick="app.openSettings()" class="w-9 h-9 flex items-center justify-center text-slate-400 hover:text-teal-600 rounded-lg hover:bg-slate-100 transition">
      <i class="fas fa-cog"></i>
    </button>
  </div>
</header>

<!-- Tabs -->
<nav class="sticky top-[56px] z-20 bg-white border-b border-slate-100 px-2 flex gap-1">
  <button onclick="app.switchTab('water')" id="tab-water" class="flex-1 py-2.5 text-xs font-bold text-slate-400 border-b-2 border-transparent transition">💧 喝水</button>
  <button onclick="app.switchTab('weight')" id="tab-weight" class="flex-1 py-2.5 text-xs font-bold text-slate-400 border-b-2 border-transparent transition">⚖️ 体重</button>
  <button onclick="app.switchTab('diet')" id="tab-diet" class="flex-1 py-2.5 text-xs font-bold text-slate-400 border-b-2 border-transparent transition">🍽️ 食谱</button>
  <button onclick="app.switchTab('exercise')" id="tab-exercise" class="flex-1 py-2.5 text-xs font-bold text-slate-400 border-b-2 border-transparent transition">🏃 运动</button>
  <button onclick="app.switchTab('cycle')" id="tab-cycle" class="flex-1 py-2.5 text-xs font-bold text-slate-400 border-b-2 border-transparent transition whitespace-nowrap">🌸 周期</button>
</nav>

<main class="px-4 pt-4 max-w-3xl mx-auto">
<section id="view-water" class="view-section"><div id="water-container"></div></section>
<section id="view-weight" class="view-section"><div id="weight-container"></div></section>
<section id="view-diet" class="view-section"><div id="diet-container"></div></section>
<section id="view-exercise" class="view-section"><div id="exercise-container"></div></section>
<section id="view-cycle" class="view-section"><div id="cycle-container"></div></section>
</main>

<!-- Settings Modal -->
<div id="settings-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-end sm:items-center justify-center" onclick="if(event.target===this) app.closeSettings()">
  <div class="bg-white w-full sm:max-w-sm rounded-t-2xl sm:rounded-2xl p-5">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-black text-slate-800">⚙️ 设置</h2>
      <button onclick="app.closeSettings()" class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-400"><i class="fas fa-times"></i></button>
    </div>
    <div class="space-y-4">
      <div>
        <label class="text-xs font-bold text-slate-400">每日喝水目标（杯）</label>
        <input id="set-water-goal" type="number" min="1" max="20" class="w-full mt-1 px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:border-teal-400 outline-none">
      </div>
      <div>
        <label class="text-xs font-bold text-slate-400">目标体重（kg，选填）</label>
        <input id="set-weight-goal" type="number" step="0.1" placeholder="如 60.0" class="w-full mt-1 px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:border-teal-400 outline-none">
      </div>
      <div>
        <label class="text-xs font-bold text-slate-400">目标腰围（cm，选填）</label>
        <input id="set-waist-goal" type="number" step="0.1" placeholder="如 80.0" class="w-full mt-1 px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:border-teal-400 outline-none">
      </div>
      <button onclick="app.saveSettings()" class="w-full py-3 rounded-xl bg-teal-500 text-white font-bold text-sm">保存</button>
    </div>
  </div>
</div>

<!-- Exercise Add Modal -->
<div id="ex-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-end sm:items-center justify-center" onclick="if(event.target===this) app.closeExModal()">
  <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-black text-slate-800">🏃 添加运动</h2>
      <button onclick="app.closeExModal()" class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-400"><i class="fas fa-times"></i></button>
    </div>
    <p id="ex-record-hint" class="text-[11px] text-slate-400 mb-1"></p>
    <div class="space-y-3">
      <div>
        <label class="text-xs font-bold text-slate-400">运动类型</label>
        <div id="ex-type-picker" class="flex flex-wrap gap-2 mt-1.5"></div>
      </div>
      <div><label class="text-xs font-bold text-slate-400">时长（分钟）</label><input id="ex-duration" type="number" min="1" placeholder="30" class="w-full mt-1 px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:border-teal-400 outline-none"></div>
      <div><label class="text-xs font-bold text-slate-400">消耗卡路里（选填，留空自动估算）</label><input id="ex-cal" type="number" min="0" placeholder="自动计算" class="w-full mt-1 px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:border-teal-400 outline-none"></div>
      <div><label class="text-xs font-bold text-slate-400">备注</label><input id="ex-note" type="text" placeholder="晨跑/健身房..." class="w-full mt-1 px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:border-teal-400 outline-none"></div>
      <button onclick="app.saveExercise()" class="w-full py-3 rounded-xl bg-teal-500 hover:bg-teal-600 text-white font-bold text-sm">保存</button>
    </div>
  </div>
</div>

<!-- Diet Add Modal -->
<div id="diet-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-end sm:items-center justify-center" onclick="if(event.target===this) app.closeDietModal()">
  <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-4">
      <h2 id="diet-modal-title" class="text-base font-black text-slate-800">🍽️ 添加食物</h2>
      <button onclick="app.closeDietModal()" class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-400"><i class="fas fa-times"></i></button>
    </div>
    <div class="space-y-3">
      <div>
        <label class="text-xs font-bold text-slate-400">食物图片（选填）</label>
        <div class="flex items-center gap-3 mt-1.5">
          <div id="diet-img-preview" class="w-16 h-16 rounded-xl bg-slate-100 flex items-center justify-center text-slate-300 overflow-hidden">
            <i class="fas fa-camera text-xl"></i>
          </div>
          <div class="flex gap-2">
            <label class="px-3 py-2 rounded-lg bg-slate-100 text-slate-600 text-xs font-bold cursor-pointer hover:bg-slate-200 transition">
              选择图片<input type="file" accept="image/*" class="hidden" onchange="app.handleDietImage(this)">
            </label>
            <button id="diet-img-clear-btn" onclick="app.clearDietImage()" class="hidden px-3 py-2 rounded-lg bg-red-50 text-red-500 text-xs font-bold">移除</button>
          </div>
        </div>
      </div>
      <div><label class="text-xs font-bold text-slate-400">食物名称</label><input id="diet-name" type="text" placeholder="米饭/鸡蛋/鸡胸肉..." class="w-full mt-1 px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:border-teal-400 outline-none"></div>
      <div><label class="text-xs font-bold text-slate-400">份量（克）</label><input id="diet-gram" type="number" min="0" placeholder="100" class="w-full mt-1 px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:border-teal-400 outline-none"></div>
      <div><label class="text-xs font-bold text-slate-400">卡路里（选填，留空自动估算）</label><input id="diet-cal" type="number" min="0" placeholder="自动计算" class="w-full mt-1 px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:border-teal-400 outline-none"></div>
      <div>
        <div class="flex items-center justify-between">
          <label class="text-xs font-bold text-slate-400">快速选择</label>
          <button onclick="app.openQuickPickModal()" class="text-[10px] text-teal-500 font-bold">管理 →</button>
        </div>
        <div id="diet-quick-pick" class="flex flex-wrap gap-1.5 mt-1.5"></div>
      </div>
      <button onclick="app.saveDietItem()" class="w-full py-3 rounded-xl bg-teal-500 hover:bg-teal-600 text-white font-bold text-sm">添加</button>
    </div>
  </div>
</div>

<!-- Weight Add Modal -->
<div id="weight-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-end sm:items-center justify-center" onclick="if(event.target===this) app.closeWeightModal()">
  <div class="bg-white w-full sm:max-w-sm rounded-t-2xl sm:rounded-2xl p-5">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-black text-slate-800">⚖️ 记录体重</h2>
      <button onclick="app.closeWeightModal()" class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-400"><i class="fas fa-times"></i></button>
    </div>
    <div class="space-y-3">
      <div><label class="text-xs font-bold text-slate-400">日期</label><input id="wt-date" type="date" class="w-full mt-1 px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:border-teal-400 outline-none"></div>
      <div><label class="text-xs font-bold text-slate-400">体重（kg）</label><input id="wt-value" type="number" step="0.1" placeholder="65.5" class="w-full mt-1 px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:border-teal-400 outline-none"></div>
      <button onclick="app.saveWeight()" class="w-full py-3 rounded-xl bg-teal-500 hover:bg-teal-600 text-white font-bold text-sm">保存</button>
    </div>
  </div>
</div>

<!-- Waist Add Modal -->
<div id="waist-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-end sm:items-center justify-center" onclick="if(event.target===this) app.closeWaistModal()">
  <div class="bg-white w-full sm:max-w-sm rounded-t-2xl sm:rounded-2xl p-5">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-black text-slate-800">📏 记录腰围</h2>
      <button onclick="app.closeWaistModal()" class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-400"><i class="fas fa-times"></i></button>
    </div>
    <div class="space-y-3">
      <div><label class="text-xs font-bold text-slate-400">日期</label><input id="ws-date" type="date" class="w-full mt-1 px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:border-teal-400 outline-none"></div>
      <div><label class="text-xs font-bold text-slate-400">腰围（cm）</label><input id="ws-value" type="number" step="0.1" placeholder="80.0" class="w-full mt-1 px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:border-teal-400 outline-none"></div>
      <button onclick="app.saveWaist()" class="w-full py-3 rounded-xl bg-teal-500 hover:bg-teal-600 text-white font-bold text-sm">保存</button>
    </div>
  </div>
</div>

<!-- Quick Pick Management Modal -->
<div id="qp-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-end sm:items-center justify-center" onclick="if(event.target===this) app.closeQuickPickModal()">
  <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-black text-slate-800">🥗 管理快速选择</h2>
      <button onclick="app.closeQuickPickModal()" class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-400"><i class="fas fa-times"></i></button>
    </div>
    <p class="text-[11px] text-slate-400 mb-3">长按拖动排序 · 点击删除按钮移除</p>
    <div id="qp-list" class="space-y-2 mb-4"></div>
    <div class="border-t border-slate-100 pt-4">
      <h3 class="text-xs font-bold text-slate-400 mb-2">添加新食物</h3>
      <div class="flex gap-2">
        <input id="qp-new-name" type="text" placeholder="食物名称" class="flex-1 px-3 py-2 rounded-lg border border-slate-200 text-sm focus:border-teal-400 outline-none">
        <input id="qp-new-cal" type="number" placeholder="卡/100g" class="w-24 px-3 py-2 rounded-lg border border-slate-200 text-sm focus:border-teal-400 outline-none">
        <button onclick="app.addCustomFood()" class="px-4 py-2 rounded-lg bg-teal-500 text-white text-sm font-bold">+</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl bg-slate-800 text-white text-xs font-bold shadow-lg toast"></div>

<!-- Cycle Record Modal -->
<div id="cycle-record-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-end sm:items-center justify-center" onclick="if(event.target===this) app.closeRecordModal()">
  <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-base font-black text-slate-800">📝 记录</h2>
      <button onclick="app.closeRecordModal()" class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-400"><i class="fas fa-times"></i></button>
    </div>
    <div class="flex gap-1 mb-4">
      <button id="cyc-rtab-sex" onclick="app.setRecordTab('sex')" class="flex-1 py-2 rounded-lg text-xs font-bold bg-slate-100 text-slate-500">性行为</button>
      <button id="cyc-rtab-symptoms" onclick="app.setRecordTab('symptoms')" class="flex-1 py-2 rounded-lg text-xs font-bold bg-slate-100 text-slate-500">身体症状</button>
      <button id="cyc-rtab-mood" onclick="app.setRecordTab('mood')" class="flex-1 py-2 rounded-lg text-xs font-bold bg-slate-100 text-slate-500">心情记录</button>
      <button id="cyc-rtab-more" onclick="app.setRecordTab('more')" class="flex-1 py-2 rounded-lg text-xs font-bold bg-slate-100 text-slate-500">更多记录</button>
    </div>
    <div class="mb-3">
      <label class="text-xs font-bold text-slate-400">日期</label>
      <input id="cyc-record-date" type="date" class="w-full mt-1 px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:border-rose-400 outline-none" onchange="app.cycleRecordDateChange()">
    </div>
    <div id="cyc-record-body"></div>
    <button onclick="app.saveCycleRecord()" class="w-full mt-4 py-3 rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-bold text-sm">完成</button>
  </div>
</div>

<div id="cycle-health-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-end sm:items-center justify-center" onclick="if(event.target===this) app.closeCycleHealth()">
  <div class="bg-white w-full sm:max-w-md sm:rounded-2xl rounded-t-3xl max-h-[80vh] flex flex-col">
    <div class="flex items-center justify-between p-4 border-b border-slate-100">
      <h3 class="text-base font-black text-slate-800">📊 经期健康数据</h3>
      <button onclick="app.closeCycleHealth()" class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-400"><i class="fas fa-times"></i></button>
    </div>
    <div id="cycle-health-body" class="p-4 overflow-y-auto"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'health_pro_state';

const FOOD_DB = {
  '米饭':{calPer100g:116},'面条':{calPer100g:280},'馒头':{calPer100g:223},'面包':{calPer100g:313},

  /* ===== REUSABLE: Heatmap ===== */
  buildHeatmap(dataMap, range, goal, rgb){
    var self=this;
    var now=new Date();
    var cells=[];
    var label='';

    if(range==='week'){
      // 本周：周一开始，周日结束（按周一对齐，而非“最近7天”）
      var monday=new Date(now);
      var _wd=monday.getDay();
      var _shift=(_wd===0?-6:1-_wd);
      monday.setDate(monday.getDate()+_shift);
      var _dowLabels=['一','二','三','四','五','六','日'];
      for(var i=0;i<7;i++){
        var d=new Date(monday); d.setDate(monday.getDate()+i);
        var ds=self.dateToStr(d);
        cells.push({date:ds,count:dataMap[ds]||0,dayLabel:_dowLabels[i]});
      }
      label='本周（周一~周日）';
      return self._heatRow(cells,goal,rgb,label);
    }

    if(range==='month'){
      var y=now.getFullYear(), m=now.getMonth();
      var dim=new Date(y,m+1,0).getDate();
      for(var i=1;i<=dim;i++){
        var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(i).padStart(2,'0');
        cells.push({date:ds,count:dataMap[ds]||0,dayLabel:i});
      }
      label=(m+1)+'月';
      return self._heatGrid(cells,goal,rgb,label,7,true);
    }

    if(range==='quarter'){
      for(var i=89;i>=0;i--){
        var d=new Date(); d.setDate(d.getDate()-i);
        var ds=self.dateToStr(d);
        cells.push({date:ds,count:dataMap[ds]||0,dayLabel:d.getDate()});
      }
      label='近一季';
      return self._heatGrid(cells,goal,rgb,label,10,false);
    }

    if(range==='year'){
      var yr=now.getFullYear();
      var start=new Date(yr,0,1);
      var dow=(start.getDay()+6)%7;
      start.setDate(start.getDate()-dow);
      var weeks=[];
      var cur=new Date(start);
      var today=new Date();
      while(cur<=today){
        var week=[];
        for(var i=0;i<7;i++){
          var ds=self.dateToStr(cur);
          if(cur.getFullYear()===yr && cur<=today) week.push({date:ds,count:dataMap[ds]||0});
          else week.push(null);
          cur.setDate(cur.getDate()+1);
        }
        weeks.push(week);
      }
      label=yr+'年';
      return self._heatYear(weeks,goal,rgb,label);
    }
    return '';
  },

  _heatCell(date,count,goal,rgb,sizeClass){
    var intensity=goal>0?Math.min(1,count/goal):0;
    var bg=count===0?'#f1f5f9':'rgba('+rgb+','+(0.25+intensity*0.75)+')';
    var fg=count>0?'#fff':'#cbd5e1';
    var sz=sizeClass||'w-7 h-7';
    return '<div class="heat-cell '+sz+' flex items-center justify-center text-[8px] font-bold" style="background:'+bg+';color:'+fg+'" title="'+date+': '+count+'">'+(count||'')+'</div>';
  },

  _heatRow(cells,goal,rgb,label){
    var self=this;
    return '<div class="flex justify-between gap-1.5">'+cells.map(function(c){
      return '<div class="flex flex-col items-center gap-1"><div class="text-[9px] font-semibold text-slate-400">'+c.dayLabel+'</div>'+self._heatCell(c.date,c.count,goal,rgb,'w-9 h-9 text-[10px]')+'</div>';
    }).join('')+'</div>';
  },

  _heatGrid(cells,goal,rgb,label,cols,showHeaders){
    var self=this;
    var html='';
    if(showHeaders){
      var hd=['一','二','三','四','五','六','日'];
      html+='<div class="grid gap-1" style="grid-template-columns:repeat('+cols+',1fr)">';
      hd.forEach(function(h){ html+='<div class="text-center text-[9px] font-semibold text-slate-400 pb-0.5">'+h+'</div>'; });
    } else {
      html+='<div class="grid gap-1" style="grid-template-columns:repeat('+cols+',1fr)">';
    }
    if(showHeaders){
      var firstDay=new Date(cells[0].date).getDay();
      var offset=(firstDay+6)%7;
      for(var i=0;i<offset;i++) html+='<div></div>';
    }
    cells.forEach(function(c){
      html+=self._heatCell(c.date,c.count,goal,rgb);
    });
    html+='</div>';
    return html;
  },

  _heatYear(weeks,goal,rgb,label){
    var self=this;
    var html='<div class="overflow-x-auto no-scrollbar pb-1"><div style="display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:2px">';
    weeks.forEach(function(week){
      week.forEach(function(cell){
        if(cell===null){ html+='<div style="width:12px;height:12px"></div>'; }
        else {
          var intensity=goal>0?Math.min(1,cell.count/goal):0;
          var bg=cell.count===0?'#f1f5f9':'rgba('+rgb+','+(0.25+intensity*0.75)+')';
          html+='<div style="width:12px;height:12px;border-radius:2px;background:'+bg+';transition:transform .1s" title="'+cell.date+': '+cell.count+'"></div>';
        }
      });
    });
    html+='</div></div>';
    html+='<div class="flex items-center justify-end gap-1 mt-2"><span class="text-[9px] text-slate-400">少</span>';
    var lvls=[0,0.25,0.5,0.75,1];
    lvls.forEach(function(l){
      var bg=l===0?'#f1f5f9':'rgba('+rgb+','+(0.25+l*0.75)+')';
      html+='<div style="width:10px;height:10px;border-radius:2px;background:'+bg+'"></div>';
    });
    html+='<span class="text-[9px] text-slate-400">多</span></div>';
    return html;
  },

  /* ===== REUSABLE: Line Chart with date range ===== */
  buildLineChart(data, range, rgb, unit, goal, prefix){
    var self=this;
    var now=new Date();
    var dMap={};
    data.forEach(function(d){ dMap[d.date]=d.value; });

    // ---- 构建坐标轴刻度（bucket）----
    var buckets=[]; // {key,label,date}
    if(range==='week'){
      // 本周：周一对齐
      var sw=new Date(now); var wd=sw.getDay(); var sh=(wd===0?-6:1-wd); sw.setDate(sw.getDate()+sh);
      var dowLabels=['一','二','三','四','五','六','日'];
      for(var i=0;i<7;i++){ var d=new Date(sw); d.setDate(sw.getDate()+i); var ds=self.dateToStr(d); buckets.push({key:ds,label:(i===0?'周一':(i===6?'周日':dowLabels[i])),date:ds}); }
    } else if(range==='month'){
      for(var i=29;i>=0;i--){ var d=new Date(now); d.setDate(d.getDate()-i); var ds=self.dateToStr(d); buckets.push({key:ds,label:ds.slice(5),date:ds}); }
    } else if(range==='quarter'){
      // 最近 3 个自然月，每月一个点
      for(var k=2;k>=0;k--){ var dm=new Date(now.getFullYear(),now.getMonth()-k,1); var yk=dm.getFullYear(),mk=dm.getMonth(); buckets.push({key:yk+'-'+String(mk+1).padStart(2,'0'),label:(mk+1)+'月',date:yk+'-'+String(mk+1).padStart(2,'0')+'-15'}); }
    } else {
      var yr=now.getFullYear();
      for(var m=0;m<12;m++){ buckets.push({key:yr+'-'+String(m+1).padStart(2,'0'),label:(m+1)+'月',date:yr+'-'+String(m+1).padStart(2,'0')+'-15'}); }
    }

    // ---- 把数据映射到刻度 ----
    var points=[];
    if(range==='week'||range==='month'){
      buckets.forEach(function(b){ if(dMap[b.key]!==undefined) points.push({date:b.key,value:dMap[b.key]}); });
    } else {
      // 月度：取该月最后一条记录
      var monthLast={};
      data.forEach(function(d){ var mk=d.date.slice(0,7); if(!monthLast[mk]||d.date>monthLast[mk].date) monthLast[mk]=d; });
      buckets.forEach(function(b){ var rec=monthLast[b.key]; if(rec) points.push({date:rec.date,value:rec.value}); });
    }
    if(points.length===0) return '<div class="text-center py-6 text-slate-300 text-sm">暂无数据，开始记录吧</div>';
    if(points.length===1) points=[points[0],points[0]];

    // ---- x 轴按真实日期定位（修复稀疏数据被“均匀铺满”的错位）----
    var W=320, H=200, pL=40, pR=15, pT=15, pB=30;
    var plotW=W-pL-pR, plotH=H-pT-pB;
    var ptsDates=points.map(function(p){return new Date(p.date);});
    var bDates=buckets.map(function(b){return new Date(b.date);});
    var minD=new Date(Math.min.apply(null,ptsDates.concat(bDates)));
    var maxD=new Date(Math.max.apply(null,ptsDates.concat(bDates)));
    var span=(maxD-minD)||86400000;
    var xOf=function(dt){ var t=(new Date(dt)-minD)/span; t=t<0?0:(t>1?1:t); return pL+t*plotW; };

    // ---- y 轴比例 ----
    var vals=points.map(function(p){return p.value;});
    var minV=Math.min.apply(null,vals), maxV=Math.max.apply(null,vals);
    var pad=(maxV-minV)||Math.max(1,maxV*0.1);
    minV-=pad; maxV+=pad;
    var rangeV=maxV-minV||1;

    var plotPts=points.map(function(p){ var x=xOf(new Date(p.date)); var y=pT+plotH-((p.value-minV)/rangeV)*plotH; return {x:x,y:y}; });
    var pathD=plotPts.map(function(p,i){ return (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1); }).join(' ');
    var areaD=pathD+' L'+(plotW+pL).toFixed(1)+','+(pT+plotH)+' L'+pL+','+(pT+plotH)+' Z';

    var yLabels=[];
    for(var i=0;i<=4;i++){ var v=minV+(rangeV*i/4); var y=pT+plotH-(i/4)*plotH; yLabels.push({v:v.toFixed(1),y:y}); }

    var xLabels=[];
    if(range==='week'){
      [0,2,4,6].forEach(function(i){ if(buckets[i]) xLabels.push({label:buckets[i].label,x:xOf(buckets[i].date)}); });
    } else if(range==='month'){
      var step=Math.max(1,Math.floor(buckets.length/6));
      buckets.forEach(function(b,i){ if(i%step===0||i===buckets.length-1) xLabels.push({label:b.label,x:xOf(b.date)}); });
    } else {
      buckets.forEach(function(b){ xLabels.push({label:b.label,x:xOf(b.date)}); });
    }

    var goalY=goal?pT+plotH-((goal-minV)/rangeV)*plotH:null;
    if(goalY&&goalY<pT) goalY=null;
    if(goalY&&goalY>pT+plotH) goalY=null;

    var svg='<div class="overflow-x-auto no-scrollbar"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="width:100%;height:200px;min-width:280px">';
    yLabels.forEach(function(yl){ svg+='<line x1="'+pL+'" y1="'+yl.y+'" x2="'+(W-pR)+'" y2="'+yl.y+'" stroke="#f1f5f9" stroke-width="1"/>'; svg+='<text x="'+(pL-4)+'" y="'+(yl.y+4)+'" font-size="10" fill="#94a3b8" text-anchor="end">'+yl.v+'</text>'; });
    svg+='<path d="'+areaD+'" fill="rgba('+rgb+',0.08)"/>';
    svg+='<path d="'+pathD+'" fill="none" stroke="rgb('+rgb+')" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    if(goalY!==null){ svg+='<line x1="'+pL+'" y1="'+goalY+'" x2="'+(W-pR)+'" y2="'+goalY+'" stroke="#10b981" stroke-width="1" stroke-dasharray="4,3"/>'; svg+='<text x="'+(W-pR)+'" y="'+(goalY-4)+'" font-size="9" fill="#10b981" text-anchor="end">目标 '+goal+'</text>'; }
    plotPts.forEach(function(p){ svg+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3" fill="rgb('+rgb+')"/>'; });
    xLabels.forEach(function(xl){ svg+='<text x="'+xl.x.toFixed(1)+'" y="'+(H-8)+'" font-size="9" fill="#94a3b8" text-anchor="middle">'+xl.label+'</text>'; });
    svg+='</svg></div>';
    return svg;
  },

  startDatePicker(prefix, label){
    var rangeLabel={week:'周',month:'月',quarter:'季',year:'年'}[this[prefix+'Range']]||'月';

  buildCustomLineChart(data, rgb, unit, goal, dateFrom, dateTo, prefix){
    var self=this;
    var filtered=data.filter(function(d){
      if(dateFrom&&d.date<dateFrom) return false;
      if(dateTo&&d.date>dateTo) return false;
      return true;
    }).sort(function(a,b){return a.date.localeCompare(b.date);});

    if(filtered.length===0) return '<div class="text-center py-6 text-slate-300 text-sm">该时间段暂无数据</div>';
    if(filtered.length===1) filtered=[filtered[0],filtered[0]];

    var vals=filtered.map(function(p){return p.value;});
    var minV=Math.min.apply(null,vals);
    var maxV=Math.max.apply(null,vals);
    var pad=(maxV-minV)||Math.max(1,maxV*0.1);
    minV-=pad; maxV+=pad;
    var rangeV=maxV-minV||1;

    var W=320,H=200,pL=40,pR=15,pT=15,pB=30;
    var plotW=W-pL-pR, plotH=H-pT-pB;

    var pathD=filtered.map(function(p,i){
      var x=pL+(filtered.length===1?plotW/2:(i/(filtered.length-1))*plotW);
      var y=pT+plotH-((p.value-minV)/rangeV)*plotH;
      return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    var areaD=pathD+' L'+(pL+plotW).toFixed(1)+','+(pT+plotH)+' L'+pL+','+(pT+plotH)+' Z';

    var yLabels=[];
    for(var i=0;i<=4;i++){ var v=minV+(rangeV*i/4); var y=pT+plotH-(i/4)*plotH; yLabels.push({v:v.toFixed(1),y:y}); }

    var xLabels=[];
    var step=Math.max(1,Math.floor(filtered.length/6));
    filtered.forEach(function(p,i){
      if(i%step===0||i===filtered.length-1){
        var x=pL+(filtered.length===1?plotW/2:(i/(filtered.length-1))*plotW);
        xLabels.push({label:p.date.slice(5),x:x});
      }
    });

    var goalY=goal?pT+plotH-((goal-minV)/rangeV)*plotH:null;
    if(goalY&&(goalY<pT||goalY>pT+plotH)) goalY=null;

    var svg='<div class="overflow-x-auto no-scrollbar"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="width:100%;height:200px;min-width:280px">';
    yLabels.forEach(function(yl){ svg+='<line x1="'+pL+'" y1="'+yl.y+'" x2="'+(W-pR)+'" y2="'+yl.y+'" stroke="#f1f5f9" stroke-width="1"/>'; svg+='<text x="'+(pL-4)+'" y="'+(yl.y+4)+'" font-size="10" fill="#94a3b8" text-anchor="end">'+yl.v+'</text>'; });
    svg+='<path d="'+areaD+'" fill="rgba('+rgb+',0.08)"/>';
    svg+='<path d="'+pathD+'" fill="none" stroke="rgb('+rgb+')" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    if(goalY!==null){ svg+='<line x1="'+pL+'" y1="'+goalY+'" x2="'+(W-pR)+'" y2="'+goalY+'" stroke="#10b981" stroke-width="1" stroke-dasharray="4,3"/>'; svg+='<text x="'+(W-pR)+'" y="'+(goalY-4)+'" font-size="9" fill="#10b981" text-anchor="end">目标 '+goal+'</text>'; }
    filtered.forEach(function(p,i){
      var x=pL+(filtered.length===1?plotW/2:(i/(filtered.length-1))*plotW);
      var y=pT+plotH-((p.value-minV)/rangeV)*plotH;
      svg+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3" fill="rgb('+rgb+')"/>';
    });
    xLabels.forEach(function(xl){ svg+='<text x="'+xl.x+'" y="'+(H-8)+'" font-size="9" fill="#94a3b8" text-anchor="middle">'+xl.label+'</text>'; });
    svg+='</svg></div>';

    return svg;
  },

    // Stats bar (horizontal)

    html+='<div class="card bg-white rounded-2xl p-4 mb-4 shadow-sm border border-slate-100">'+

      '<div class="absolute inset-0 flex flex-col items-center justify-center"><span class="text-lg font-black text-amber-500">'+totalCal+'</span><span class="text-[9px] text-slate-400">kcal</span></div></div>'+
      '<div class="flex-1"><div class="text-sm font-bold text-slate-700">今日摄入 '+totalCal+' kcal</div>'+

    MEALS.forEach(function(m){

        '<button onclick="app.openDietModal(\''+m.key+'\')" class="px-2.5 py-1 rounded-lg text-xs font-bold" style="background:rgba('+m.rgb+',0.1);color:rgb('+m.rgb+')">+ 添加</button></div>'+
        (items.length===0?'<p class="text-xs text-slate-300 text-center py-3">还没有记录</p>':
          items.map(function(item,i){
            return '<div class="food-item flex items-center justify-between py-2 border-b border-slate-50 last:border-0">'+
              '<div class="flex items-center gap-2">'+
              (item.img?'<img src="'+item.img+'" class="w-10 h-10 rounded-lg object-cover">':'')+
              '<div><span class="text-sm font-semibold text-slate-700">'+item.name+'</span>'+(item.gram?'<span class="text-xs text-slate-400 ml-1">'+item.gram+'g</span>':'')+'</div></div>'+
              '<div class="flex items-center gap-2"><span class="text-sm font-bold text-amber-500">'+(item.cal||0)+'</span><span class="text-[10px] text-slate-400">kcal</span>'+
              '<button type="button" onclick="app.deleteDietItem(\''+m.key+'\','+i+')" aria-label="删除" class="w-7 h-7 ml-1 rounded-full flex items-center justify-center text-slate-400 hover:text-red-500 hover:bg-red-50 active:scale-90 transition"><i class="fas fa-trash"></i></button></div></div>';

    html+=this.renderFoodCalendar();

    // Drink calendar
    html+=this.renderDrinkCalendar();

    document.getElementById('diet-container').innerHTML=html;
  },

  /* ===== 食谱日历 (Food Calendar) — 看每天吃了什么，而不是卡路里 ===== */
  renderFoodCalendar(){
    var self=this;
    var now=new Date();
    if(!this.foodCalYear) this.foodCalYear=now.getFullYear();
    if(!this.foodCalMonth) this.foodCalMonth=now.getMonth();
    var y=this.foodCalYear, m=this.foodCalMonth;
    var dim=new Date(y,m+1,0).getDate();
    var firstDay=new Date(y,m,1).getDay();
    var offset=(firstDay+6)%7;
    var monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

    // 收集当月每天的食谱数据
    var monthData={};
    var recordedDays=0, totalItems=0;
    for(var d=1; d<=dim; d++){
      var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var dayDiet=this.state.diet[ds];
      if(dayDiet){
        var mealsWithItems=[];
        var itemsCount=0;
        MEALS.forEach(function(meal){
          var arr=dayDiet[meal.key]||[];
          if(arr.length>0){ mealsWithItems.push(meal); itemsCount+=arr.length; }
        });
        if(itemsCount>0){
          monthData[ds]={meals:mealsWithItems, count:itemsCount, diet:dayDiet};
          recordedDays++; totalItems+=itemsCount;
        }
      }
    }

    var html='<div class="card bg-white rounded-2xl p-5 mb-4 shadow-sm border border-slate-100">'+
      '<div class="flex items-center justify-between mb-3">'+
      '<button onclick="app.foodCalPrev()" class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-500"><i class="fas fa-chevron-left text-xs"></i></button>'+
      '<h2 class="font-bold text-sm">📅 食谱日历</h2>'+
      '<button onclick="app.foodCalNext()" class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-500"><i class="fas fa-chevron-right text-xs"></i></button>'+
      '</div>'+
      '<div class="text-center mb-3"><span class="text-base font-black text-slate-700">'+y+'年 '+monthNames[m]+'</span>'+
      ' <span class="text-[11px] text-slate-400">· 已记录 '+recordedDays+' 天 / '+totalItems+' 餐</span></div>';

    // 日期跳转
    html+='<div class="flex items-center gap-2 mb-3">'+
      '<span class="text-[10px] text-slate-400 font-bold">跳转日期：</span>'+
      '<input type="date" id="foodCalJumpInput" class="text-xs px-2 py-1 rounded-lg border border-slate-200 outline-none focus:border-teal-400" onchange="app.foodCalJump()">'+
      '</div>';

    // 日历网格（周一开头）
    var weekDays=['一','二','三','四','五','六','日'];
    html+='<div class="grid grid-cols-7 gap-1.5">';
    weekDays.forEach(function(w){ html+='<div class="text-center text-[10px] font-bold text-slate-400 pb-1">'+w+'</div>'; });
    for(var i=0;i<offset;i++) html+='<div></div>';
    var todayStr=this.todayStr();
    for(var d=1; d<=dim; d++){
      var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var dd=monthData[ds];
      var isToday=ds===todayStr;
      var bg=dd?'bg-amber-50 border-amber-200':'bg-slate-50 border-slate-100';
      var todayCls=isToday?'ring-2 ring-teal-400':'';
      html+='<div class="'+bg+' '+todayCls+' rounded-lg p-1.5 min-h-[80px] flex flex-col items-center cursor-pointer" onclick="app.showFoodDayDetail(\''+ds+'\')">';
      html+='<span class="text-[11px] font-bold '+(isToday?'text-teal-600':'text-slate-500')+'">'+d+'</span>';
      if(dd){
        html+='<div class="flex flex-wrap gap-0.5 mt-0.5 justify-center">';
        dd.meals.forEach(function(meal){ html+='<span class="text-[12px] leading-none">'+meal.icon+'</span>'; });
        html+='</div>';
        var sample=[];
        MEALS.forEach(function(meal){ (dd.diet[meal.key]||[]).forEach(function(it){ sample.push(it.name); }); });
        var preview=sample.slice(0,3).join('、');
        if(sample.length>3) preview+='…';
        html+='<span class="text-[9px] text-slate-500 mt-0.5 text-center leading-tight px-0.5 break-all">'+preview+'</span>';
      }
      html+='</div>';
    }
    html+='</div>';

    // 当日详情面板
    html+='<div id="food-cal-detail" class="mt-3"></div>';
    html+='</div>';
    return html;
  },

    this.foodCalMonth--;
    if(this.foodCalMonth<0){ this.foodCalMonth=11; this.foodCalYear--; }
    this.renderDiet();
  },

          '<div class="flex-1 min-w-0"><div class="text-xs font-semibold text-slate-700 truncate">'+item.name+'</div>'+
          '<div class="text-[10px] text-slate-400">'+(item.gram?item.gram+'g':'无分量')+(item.cal?(' · '+(item.cal)+' kcal'):'')+'</div></div></div>';
      });
    });
    html+='</div>'+
      '<button onclick="app.setDietActiveDate(\''+date+'\')" class="mt-2 w-full py-2 rounded-lg bg-amber-500 text-white text-xs font-bold active:scale-95 transition">✏️ 把这一天设为记录日（可添加/删除食物）</button>'+
      '</div>';
    detail.innerHTML=html;
  },

  handleDietImage(input){
    var file=input.files[0];
    if(!file) return;
    var self=this;
    var reader=new FileReader();
    reader.onload=function(e){
      var img=new Image();
      img.onload=function(){
        var canvas=document.createElement('canvas');
        var maxW=200, maxH=200;
        var w=img.width, h=img.height;
        if(w>h){ if(w>maxW){h*=maxW/w;w=maxW;} } else { if(h>maxH){w*=maxH/h;h=maxH;} }
        canvas.width=w; canvas.height=h;
        var ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        self.dietImageData=canvas.toDataURL('image/jpeg',0.7);
        var preview=document.getElementById('diet-img-preview');
        preview.innerHTML='<img src="'+self.dietImageData+'" class="w-full h-full object-cover">';
        document.getElementById('diet-img-clear-btn').classList.remove('hidden');
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  },

    document.getElementById('diet-img-preview').innerHTML='<i class="fas fa-camera text-xl"></i>';

  saveDietItem(){
    var name=document.getElementById('diet-name').value.trim();
    var gram=parseFloat(document.getElementById('diet-gram').value)||0;
    var cal=parseFloat(document.getElementById('diet-cal').value)||0;
    if(!name){ this.toast('请输入食物名称'); return; }
    if(!cal&&gram>0){
      var item=this.state.quickPicks.find(function(q){return q.name===name;});
      if(item) cal=Math.round(item.calPer100g*gram/100);
    }
    var today=this.dietActiveDate||this.todayStr();
    if(!this.state.diet[today]) { var d={}; MEALS.forEach(function(m){d[m.key]=[];}); this.state.diet[today]=d; }
    if(!this.state.diet[today][this.currentMeal]) this.state.diet[today][this.currentMeal]=[];
    var newItem={id:'d'+Date.now()+'-'+Math.floor(Math.random()*1000),name:name,gram:gram,cal:cal};
    if(this.dietImageData) newItem.img=this.dietImageData;
    this.state.diet[today][this.currentMeal].push(newItem);
    this.saveState(); this.closeDietModal(); this.renderDiet();
    this.pushDietItemToReviews(today,this.currentMeal,newItem);
    this.toast('✅ 已添加 '+name+'（已同步到小众点评）');
  },

  deleteDietItem(meal,idx){
    var today=this.dietActiveDate||this.todayStr();
    if(this.state.diet[today]&&this.state.diet[today][meal]){
      this.state.diet[today][meal].splice(idx,1);
      this.saveState(); this.renderDiet();
      this.syncReviewsAfterDietDelete();
    }
  },

  /* ===== Push diet item into 小众点评 (reviews) as a pending review =====
     Avoids double entry: a logged food appears in 小众点评 ready to be rated later.
     Dedup by name so the same dish maps to one review you rate once. */
  mapMealToCategoryId(mealKey,name,categories){
    var prefer={breakfast:'meal',lunch:'meal',dinner:'meal',snack:'snack',drink:(name.indexOf('咖啡')>=0?'coffee':'milktea')};
    var pid=prefer[mealKey]||'';
    if(pid&&categories.some(function(c){return c.id===pid;})) return pid;
    var kw={meal:'正餐',snack:'零食',coffee:'咖啡',milktea:'奶茶'}[pid]||'';
    if(kw){ var found=categories.find(function(c){return (c.name||'').indexOf(kw)>=0;}); if(found) return found.id; }
    var mealLabel={breakfast:'早餐',lunch:'午餐',dinner:'晚餐',snack:'加餐',drink:'奶茶咖啡'}[mealKey];
    if(mealLabel){ var f2=categories.find(function(c){return (c.name||'').indexOf(mealLabel)>=0;}); if(f2) return f2.id; }
    return '';
  },

  pushDietItemToReviews(date,mealKey,item){
    try{
      var rs=JSON.parse(localStorage.getItem('reviews_pro_state')||'{}');
      if(!rs.reviews) rs.reviews=[];
      if(!rs.categories) rs.categories=[];
      var name=(item.name||'').trim();
      if(!name) return;
      var catId=this.mapMealToCategoryId(mealKey,name,rs.categories);
      var nameKey=name.toLowerCase();
      var existing=rs.reviews.find(function(r){return (r.name||'').trim().toLowerCase()===nameKey;});
      if(existing){
        if(!existing.photo&&item.img) existing.photo=item.img;
        if(!existing.date) existing.date=date;
        if(!existing.categoryId) existing.categoryId=catId;
        if(!existing._src){ existing._src='health'; existing._srcId=item.id; existing._srcMeal=mealKey; }
      } else {
        rs.reviews.unshift({
          id:'r'+Date.now()+'-'+Math.floor(Math.random()*1000),
          name:name,
          categoryId:catId,
          place:'',
          rating:0,
          price:'',
          tags:[],
          photo:item.img||null,
          text:'',
          date:date,
          _src:'health',
          _srcId:item.id,
          _srcMeal:mealKey
        });
      }
      localStorage.setItem('reviews_pro_state',JSON.stringify(rs));
      if(window.parent&&window.parent!==window) window.parent.postMessage({type:'dashboard-refresh'},'*');
    }catch(e){ console.error('pushDietItemToReviews failed',e); }
  },

  /* ===== When a diet item is deleted, reconcile the linked 小众点评 pending reviews.
     A food name maps to ONE pending review (dedup). If that name no longer exists
     anywhere in the diet records, remove the still-pending (unrated) health review.
     Rated/edited health reviews are kept so we never destroy the user's own review. */
  syncReviewsAfterDietDelete(){
    try{
      var rs=JSON.parse(localStorage.getItem('reviews_pro_state')||'{}');
      if(!rs.reviews||!rs.reviews.length) return;
      var names={};
      var diet=this.state.diet||{};
      Object.keys(diet).forEach(function(day){
        var d=diet[day]||{};
        Object.keys(d).forEach(function(meal){
          (d[meal]||[]).forEach(function(it){ if(it&&it.name){ names[(it.name||'').trim().toLowerCase()]=true; } });
        });
      });
      var before=rs.reviews.length;
      rs.reviews=rs.reviews.filter(function(r){
        if(r._src==='health' && !r.rating){
          var k=(r.name||'').trim().toLowerCase();
          return names[k]===true; // keep only if name still exists in diet
        }
        return true; // keep manual reviews and rated health reviews
      });
      if(rs.reviews.length!==before){
        localStorage.setItem('reviews_pro_state',JSON.stringify(rs));
        if(window.parent&&window.parent!==window) window.parent.postMessage({type:'dashboard-refresh'},'*');
        this.toast('🗑️ 已同步删除小众点评待点评');
      }
    }catch(e){ console.error('syncReviewsAfterDietDelete failed',e); }
  },

  /* ===== CYCLE DATE HELPERS ===== */
  cycleActToday(){ this.cycleActiveDate=this.todayStr(); this.renderCycle(); },

  cycleRecSummary(d){
    var c=this.state.cycle;
    return {
      sex: !!(c.sex[d] && c.sex[d]!=='none'),
      symptoms: !!(c.symptoms[d] && c.symptoms[d].length),

    };

  renderExercise(){
    var self=this;
    var today=this.todayStr();
    var activeDate=this.exerciseActiveDate||today;
    var isActiveToday=(activeDate===today);
    var todayEx=this.state.exercise[activeDate]||[];
    var todayCal=todayEx.reduce(function(s,e){return s+(e.cal||0);},0);
    var todayMin=todayEx.reduce(function(s,e){return s+(e.duration||0);},0);

    if(!duration||duration<=0){ this.toast('请输入运动时长'); return; }

  /* ===== 生理周期 / CYCLE ===== */
  parseDate(s){ return new Date(s+'T00:00:00'); },
  addDays(s,n){ var d=this.parseDate(s); d.setDate(d.getDate()+n); return this.dateToStr(d); },
  diffDays(a,b){ return Math.round((this.parseDate(b)-this.parseDate(a))/86400000); },
  fmtShort(s){ var d=this.parseDate(s); return (d.getMonth()+1)+'月'+d.getDate()+'日'; },

  periodStarts(){
    var c=this.state.cycle; var cl=c.cycleLength||28;
    var anchor=c.lastPeriodStart||this.todayStr();
    var starts=[anchor];
    var s=anchor;
    for(var i=0;i<4;i++){ s=this.addDays(s,-cl); starts.unshift(s); }
    s=anchor;
    for(var j=0;j<4;j++){ s=this.addDays(s,cl); starts.push(s); }
    return starts;
  },
  classifyDay(date){
    var c=this.state.cycle;
    var cl=c.cycleLength||28, pl=c.periodLength||5, ll=c.lutealLength||14;
    var starts=this.periodStarts();
    var cur=null;
    for(var i=0;i<starts.length;i++){ if(this.diffDays(starts[i],date)>=0) cur=starts[i]; }
    if(!cur) return {type:'other'};
    var off=this.diffDays(cur,date);
    var next=this.addDays(cur,cl);
    var offNext=this.diffDays(date,next);
    var ovu=this.addDays(cur,cl-ll);
    var today=this.todayStr();
    if(off>=0 && off<pl){
      var isFuture=this.diffDays(today,date)>0;
      if(c.periods[date]||!isFuture) return {type:'period', first:off===0, logged:!!c.periods[date]};
      return {type:'predict'};
    }
    if(offNext>=0 && offNext<pl) return {type:'predict'};
    if(date===ovu) return {type:'ovu'};
    var offOvu=this.diffDays(ovu,date);
    if(offOvu>=-5 && offOvu<=1) return {type:'fertile'};
    return {type:'other'};
  },
  nextPeriodStart(){
    var starts=this.periodStarts(); var today=this.todayStr();
    for(var i=0;i<starts.length;i++){ if(this.diffDays(today,starts[i])>=0) return starts[i]; }
    return starts[starts.length-1];
  },
  currentPeriodStart(){
    var starts=this.periodStarts(); var today=this.todayStr();
    var cur=null;
    for(var i=0;i<starts.length;i++){ if(this.diffDays(starts[i],today)>=0) cur=starts[i]; }
    return cur;
  },

  setCycleView(v){ this.cycleView=v; this.renderCycle(); },
  cycleMonthPrev(){ var m=this.cycleMonth||this.todayStr().slice(0,7); var d=this.parseDate(m+'-01'); d.setDate(d.getDate()-1); this.cycleMonth=this.dateToStr(d).slice(0,7); this.renderCycle(); },
  cycleMonthNext(){ var m=this.cycleMonth||this.todayStr().slice(0,7); var d=this.parseDate(m+'-01'); d.setMonth(d.getMonth()+1); this.cycleMonth=this.dateToStr(d).slice(0,7); this.renderCycle(); },
  toggleMonthPicker(){

  cycleMonthGo(y,m){ this.cycleMonth=String(y).padStart(4,'0')+'-'+String(m).padStart(2,'0'); this.renderCycle(); },
  cycleMonthGoToday(){ this.cycleMonth=this.todayStr().slice(0,7); this.renderCycle(); },
  cycleMonthPrevYear(){ var m=this.cycleMonth||this.todayStr().slice(0,7); this.cycleMonth=(parseInt(m.slice(0,4))-1)+m.slice(4); this.renderCycle(); },
  cycleMonthNextYear(){ var m=this.cycleMonth||this.todayStr().slice(0,7); this.cycleMonth=(parseInt(m.slice(0,4))+1)+m.slice(4); this.renderCycle(); },

  renderCycle(){
    var self=this;
    if(!this.cycleMonth) this.cycleMonth=this.todayStr().slice(0,7);
    var c=this.state.cycle;
    var today=this.todayStr();
    var nxt=this.nextPeriodStart();
    var daysUntil=this.diffDays(today,nxt);
    var curStart=this.currentPeriodStart();
    var cls=this.classifyDay(today);
    var heroLabel, heroNum;
    if(cls.type==='period'){
      heroLabel='经期第'; heroNum=(this.diffDays(curStart,today)+1);
    } else {
      heroLabel='距预测经期'; heroNum=daysUntil;
    }
    var container=document.getElementById('cycle-container');
    var viewToggle='<div class="flex gap-1 bg-slate-100 rounded-xl p-1 mb-3">'+
      '<button onclick="app.setCycleView(\'calendar\')" class="cycle-tab flex-1 py-2 rounded-lg text-xs font-bold '+(this.cycleView==='calendar'?'active':'text-slate-500')+'">📅 日历视图</button>'+
      '<button onclick="app.setCycleView(\'ring\')" class="cycle-tab flex-1 py-2 rounded-lg text-xs font-bold '+(this.cycleView==='ring'?'active':'text-slate-500')+'">🔵 周期视图</button></div>';

    // 紧凑 Hero（移除绝对定位的心形图标，避免产生空白区；用纯渐变背景）
    var hero='<div class="bg-gradient-to-br from-rose-500 to-pink-500 rounded-2xl px-4 py-3 mb-3 text-white shadow-lg">'+
      '<div class="flex items-end justify-between gap-3">'+
        '<div>'+
          '<div class="text-[11px] opacity-90 font-medium leading-tight">'+heroLabel+'</div>'+
          '<div class="text-3xl font-black tracking-tight leading-tight mt-0.5"><span class="inline-block">'+heroNum+'</span> <span class="text-sm font-bold align-middle">天</span></div>'+
        '</div>'+
        '<div class="text-right text-[10px] opacity-85 leading-tight pb-1">'+
          '<div>周期共 '+(c.cycleLength||28)+' 天</div>'+
          (curStart?'<div class="mt-0.5">上次经期 '+this.fmtShort(curStart)+'</div>':'')+
        '</div>'+
      '</div>'+
      '</div>';

    var body = (this.cycleView==='calendar') ? this.renderCycleCalendar() : this.renderCycleRing();

    var legend='<div class="cyc-legend text-[10px] text-slate-500 mt-2 mb-1 leading-tight">'+
      '<span><i style="background:#e11d48"></i>经期</span>'+
      '<span><i style="background:#fff;border:1.5px dashed #f43f5e"></i>预测经期</span>'+

    // 经期记录（含流量/痛经强度）
    var pr = c.periods[actDate] || null;

      '<div class="px-4 py-3 bg-rose-50/50 border-t border-rose-100 space-y-3">'+

    function row(icCls, icon, label, tab, has, logIcon){

      return '<div class="cyc-action-row '+(has?'has-log':'')+'" onclick="app.openRecordModal(\''+tab+'\',\''+actDate+'\')">'+
        '<span class="ic '+icCls+'">'+icon+'</span>'+

    }

    var dateBar='<div class="cyc-datebar">'+
      '<span class="label">记录日期</span>'+
      '<button class="nav-btn" onclick="app.cycleActPrev()"><i class="fas fa-chevron-left text-xs"></i></button>'+
      '<span class="date">'+this.fmtShort(actDate)+'</span>'+
      '<button class="nav-btn" onclick="app.cycleActNext()"><i class="fas fa-chevron-right text-xs"></i></button>'+
      '<button class="today-btn '+(actToday?'active':'')+'" onclick="app.cycleActToday()">今天</button>'+
      '</div>';

    // 单一卡片紧凑布局：日历/周期 + 图例 + 体温 + 日期栏 + 操作区（无多余空白）
    var mainCard='<div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">'+
      '<div class="p-4">'+body+legend+'</div>'+
      bbtInner+
      dateBar+
      '<div class="cyc-action-row" onclick="app.togglePeriodStart()">'+
        '<span class="ic rose">🩸</span>'+
        '<span class="lbl">经期开始了吗？</span>'+
        '<span class="cyc-toggle '+(periodOn?'on':'')+'"><span class="knob"></span></span>'+
      '</div>'+
      subItems+
      row('rose','❤️','性行为','sex',rec.sex,'💕')+
      row('rose','🤒','身体症状','symptoms',rec.symptoms,'➕')+
      row('amber','😊','心情','mood',rec.mood,'😄')+
      row('slate','📋','更多记录','more',rec.more,'🌡️')+
      '<div class="cyc-action-row" onclick="app.openCycleHealth()">'+
        '<span class="ic slate">📊</span>'+
        '<span class="lbl">查看生理周期期间的健康数据</span>'+
        '<span class="ic-arrow">›</span></div>'+
      '</div>';

    container.innerHTML = viewToggle + hero + mainCard;
  },

  renderCycleCalendar(){
    var month=this.cycleMonth;
    var y=parseInt(month.slice(0,4)), m=parseInt(month.slice(5,7))-1;
    var first=new Date(y,m,1);
    var startPad=first.getDay();
    var daysInMonth=new Date(y,m+1,0).getDate();
    var today=this.todayStr();
    var cells='';
    var dow=['日','一','二','三','四','五','六'];
    var head='<div class="flex items-center justify-between mb-3 relative">'+
      '<button onclick="app.cycleMonthPrev()" class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-500"><i class="fas fa-chevron-left text-xs"></i></button>'+
      '<button onclick="app.toggleMonthPicker()" class="flex-1 mx-2 py-1.5 rounded-lg active:bg-slate-100 transition flex items-center justify-center gap-1.5 text-sm font-black text-slate-700">'+
        '<span>'+(y-2000)+'年'+(m+1)+'月</span>'+
        '<i class="fas fa-chevron-down text-[10px] text-slate-400"></i>'+
      '</button>'+
      '<button onclick="app.cycleMonthNext()" class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-500"><i class="fas fa-chevron-right text-xs"></i></button>'+
      '<div id="month-picker" class="hidden absolute top-full left-0 right-0 mt-2 bg-white rounded-2xl shadow-xl border border-slate-200 p-3 z-30">'+
        '<div class="flex items-center justify-between mb-2"><button onclick="app.cycleMonthPrevYear()" class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 text-xs"><i class="fas fa-chevron-left"></i></button>'+
        '<span id="mp-year" class="text-sm font-black text-slate-700">'+y+'年</span>'+
        '<button onclick="app.cycleMonthNextYear()" class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 text-xs"><i class="fas fa-chevron-right"></i></button></div>'+
        '<div class="grid grid-cols-4 gap-2" id="mp-grid"></div>'+
        '<div class="mt-2 flex justify-between items-center"><button onclick="app.cycleMonthGoToday()" class="text-[11px] font-bold text-rose-500 px-2 py-1">回到本月</button>'+
        '<span class="text-[10px] text-slate-400">点击月份直接跳转</span></div>'+
      '</div>'+
      '</div>';
    var dowRow='<div class="grid grid-cols-7 gap-1 mb-1 text-center text-[10px] font-bold text-slate-300">'+dow.map(function(d){return '<div>'+d+'</div>';}).join('')+'</div>';
    cells+='<div class="grid grid-cols-7 gap-1">';
    for(var p=0;p<startPad;p++){ cells+='<div></div>'; }
    for(var day=1;day<=daysInMonth;day++){
      var ds=this.dateToStr(new Date(y,m,day));
      var cl=this.classifyDay(ds);
      var clsName='cyc-other';
      if(cl.type==='period') clsName=cl.first?'cyc-period-first':'cyc-period';
      else if(cl.type==='predict') clsName='cyc-predict';
      else if(cl.type==='ovu') clsName='cyc-ovu';
      else if(cl.type==='fertile') clsName='cyc-fertile';
      var isToday=(ds===today)?' cyc-today':'';
      var ind='';
      var hasData=(this.state.cycle.sex[ds]||(this.state.cycle.symptoms[ds]&&this.state.cycle.symptoms[ds].length)||(this.state.cycle.mood[ds]&&this.state.cycle.mood[ds].length)||this.state.cycle.bbt[ds])?'<span class="absolute bottom-0.5 w-1 h-1 rounded-full '+(clsName.indexOf('period')>=0||clsName==='cyc-predict'?'bg-rose-400':'bg-slate-400')+'"></span>':'';
      cells+='<div class="cyc-day '+clsName+isToday+'" onclick="app.openRecordModal(\'symptoms\',\''+ds+'\')">'+day+ind+'</div>';
    }
    cells+='</div>';
    return '<div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">'+head+dowRow+cells+'</div>';
  },

  renderCycleRing(){
    var c=this.state.cycle;
    var cl=c.cycleLength||28, pl=c.periodLength||5, ll=c.lutealLength||14;
    var r=52, cx=60, cy=60, C=2*Math.PI*r;
    function arc(f0, fLen, color, w){
      var len=fLen*C; var off=-f0*C;
      return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+w+'" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    }
    var ovuFrac=(cl-ll)/cl;
    var ferF0=(cl-ll-5)/cl, ferLen=6/cl;
    var today=this.todayStr();
    var cur=this.currentPeriodStart();
    var todayFrac=cur?this.diffDays(cur,today)/cl:0; if(todayFrac<0)todayFrac=0; if(todayFrac>1)todayFrac=1;
    function pos(f){ var a=-Math.PI/2 + f*2*Math.PI; return {x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)}; }
    var ovP=pos(ovuFrac), tdP=pos(todayFrac);
    var nxt=this.nextPeriodStart();
    var range=cur? (this.fmtShort(cur)+' - '+this.fmtShort(this.addDays(nxt,-1))) : '';
    var ring='<svg viewBox="0 0 120 120" class="w-full h-full">'+
      arc(0,1,'#f1f5f9',11)+
      arc(0,pl/cl,'#f43f5e',11)+
      arc(ferF0,ferLen,'#60a5fa',11)+
      '<circle cx="'+ovP.x.toFixed(1)+'" cy="'+ovP.y.toFixed(1)+'" r="5" fill="#2563eb"/>'+
      '<circle cx="'+tdP.x.toFixed(1)+'" cy="'+tdP.y.toFixed(1)+'" r="5.5" fill="#0f172a" stroke="#fff" stroke-width="2"/>'+
      '</svg>';
    var center='<div class="absolute inset-0 flex flex-col items-center justify-center text-center">'+
      '<div class="text-[11px] text-slate-400">'+range+'</div>'+
      '<div class="text-3xl font-black text-rose-500 leading-none mt-1">'+this.diffDays(today,nxt)+'<span class="text-sm">天</span></div>'+
      '<div class="text-[10px] text-slate-400 mt-1">距预测经期 · 周期共 '+cl+' 天</div></div>';
    return '<div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col items-center">'+
      '<div class="relative w-[210px] h-[210px]">'+ring+center+'</div>'+
      '<div class="text-[11px] text-slate-400 mt-2">🔵 蓝点=排卵日 · ⚫ 黑点=今天</div></div>';
  },

  renderBbtCard(){
    var bbt=this.state.cycle.bbt||{};
    var keys=Object.keys(bbt);
    if(keys.length===0) return '';
    var vals=keys.map(function(k){return bbt[k];});
    var sum=vals.reduce(function(a,b){return a+b;},0);
    var baseline=sum/vals.length;
    var cur=this.currentPeriodStart(); var nxt=this.nextPeriodStart();
    var cycVals=keys.filter(function(k){ return (!cur||this.diffDays(cur,k)>=0) && this.diffDays(k,nxt)>=0; }, this).map(function(k){return bbt[k];});
    var avg = cycVals.length? (cycVals.reduce(function(a,b){return a+b;},0)/cycVals.length) : baseline;
    var delta=avg-baseline;
    var sign=delta>0?'+':'';
    var latest=keys.slice().sort().pop();
    return '<div class="px-4 py-3 border-t border-slate-100 bg-gradient-to-br from-amber-50 to-orange-50">'+
      '<div class="flex items-center justify-between"><span class="text-xs font-bold text-slate-500">🌡️ 平均手腕温度</span>'+
      '<span class="text-xs font-bold text-amber-600">'+(delta>=0?'高于':'低于')+'基线 '+sign+delta.toFixed(2)+'℃</span></div>'+
      '<div class="text-2xl font-black text-slate-700 mt-1">'+avg.toFixed(2)+' <span class="text-xs font-medium text-slate-400">℃</span></div>'+
      '<div class="text-[10px] text-slate-400 mt-1">最近一次 '+latest+'：'+bbt[latest].toFixed(2)+'℃（共 '+keys.length+' 条）</div></div>';
  },

  togglePeriodStart(){
    var actDate = this.cycleActiveDate || this.todayStr();
    var c=this.state.cycle;
    if(c.periods[actDate]){ delete c.periods[actDate]; this.toast('已取消该日经期记录'); }
    else { c.periods[actDate]={flow:2, cramp:0}; if(!c.lastPeriodStart) c.lastPeriodStart=actDate; this.toast('✅ 已记录为经期开始'); }
    this.saveState(); this.renderCycle();
  },
  setPeriodFlow(lv){
    var actDate = this.cycleActiveDate || this.todayStr();
    var c=this.state.cycle;
    if(!c.periods[actDate]) c.periods[actDate]={flow:2, cramp:0};
    c.periods[actDate].flow=lv; this.saveState(); this.renderCycle();
  },
  setPeriodCramp(lv){
    var actDate = this.cycleActiveDate || this.todayStr();
    var c=this.state.cycle;
    if(!c.periods[actDate]) c.periods[actDate]={flow:2, cramp:0};
    c.periods[actDate].cramp=lv; this.saveState(); this.renderCycle();
  },

  openRecordModal(tab, date){
    this.recordTab=tab||'sex';
    if(date) this.cycleRecordDate=date; else if(!this.cycleRecordDate) this.cycleRecordDate=this.todayStr();
    var c=this.state.cycle; var d=this.cycleRecordDate;
    this._cycSel={ sex: c.sex[d]||'none', symptoms: (c.symptoms[d]||[]).slice(), mood:(c.mood[d]||[]).slice() };
    document.getElementById('cyc-record-date').value=d;
    this.setRecordTab(this.recordTab);
    document.getElementById('cycle-record-modal').classList.remove('hidden');
  },
  closeRecordModal(){ document.getElementById('cycle-record-modal').classList.add('hidden'); },
  openCycleHealth(){
    var self=this;
    var c=this.state.cycle;
    var starts=this.periodStarts();
    if(!starts.length){ document.getElementById('cycle-health-body').innerHTML='<div class="text-center text-sm text-slate-400 py-10">还没有经期记录，无法汇总数据</div>'; document.getElementById('cycle-health-modal').classList.remove('hidden'); return; }
    var rows=[];
    starts.forEach(function(s){
      var e=self.addDays(s, (c.periodLength||5)-1);
      var days=self.diffDays(s,e)+1;
      var water=0, waterDays=0, dietCal=0, dietDays=0, exMin=0, exCal=0, exDays=0, weightSum=0, weightN=0;
      for(var d=new Date(s); self.diffDays(self.dateToStr(d),e)<=0; d.setDate(d.getDate()+1)){
        var ds=self.dateToStr(d);
        if(self.state.water[ds]){ water+=self.state.water[ds].length; waterDays++; }
        if(self.state.diet[ds]&&self.state.diet[ds].length){ var cals=self.state.diet[ds].reduce(function(a,i){return a+(i.cal||0);},0); dietCal+=cals; dietDays++; }
        if(self.state.exercise[ds]&&self.state.exercise[ds].length){ self.state.exercise[ds].forEach(function(x){ exMin+=(x.duration||0); exCal+=(x.cal||0); }); exDays++; }
        if(self.state.weight[ds]){ weightSum+=self.state.weight[ds]; weightN++; }
      }
      rows.push({s:s,e:e,days:days,water:water,waterDays:waterDays,dietCal:dietCal,dietDays:dietDays,exMin:exMin,exCal:exCal,exDays:exDays,weight:weightN?weightSum/weightN:null});
    });
    var rowsHtml=rows.map(function(r){
      var avgW=r.waterDays? (r.water/r.waterDays).toFixed(1):'—';
      var avgD=r.dietDays? Math.round(r.dietCal/r.dietDays):'—';
      var avgE=r.exDays? Math.round(r.exMin/r.exDays):'—';
      return '<div class="bg-slate-50 rounded-xl p-3 mb-2">'+
        '<div class="flex items-center justify-between mb-2"><span class="text-xs font-bold text-rose-500">'+self.fmtShort(r.s)+' ~ '+self.fmtShort(r.e)+'</span><span class="text-[10px] text-slate-400">'+r.days+' 天</span></div>'+
        '<div class="grid grid-cols-2 gap-2 text-[11px]">'+
          '<div class="flex justify-between"><span class="text-slate-400">💧 日均喝水</span><span class="font-bold text-slate-700">'+avgW+' 杯</span></div>'+
          '<div class="flex justify-between"><span class="text-slate-400">🍱 日均摄入</span><span class="font-bold text-slate-700">'+(avgD==='—'?'—':avgD)+' kcal</span></div>'+
          '<div class="flex justify-between"><span class="text-slate-400">🏃 日均运动</span><span class="font-bold text-slate-700">'+(avgE==='—'?'—':avgE)+' 分钟</span></div>'+
          '<div class="flex justify-between"><span class="text-slate-400">⚖️ 平均体重</span><span class="font-bold text-slate-700">'+(r.weight?r.weight.toFixed(1):'—')+' kg</span></div>'+
        '</div></div>';
    }).join('');
    var last=rows[rows.length-1];
    var html='<p class="text-[11px] text-slate-400 mb-3">每次经期期间的健康数据汇总（最近 '+(rows.length<=5?rows.length:5)+' 次）</p>'+rowsHtml;
    document.getElementById('cycle-health-body').innerHTML=html;
    document.getElementById('cycle-health-modal').classList.remove('hidden');
  },
  closeCycleHealth(){ document.getElementById('cycle-health-modal').classList.add('hidden'); },
  cycleRecordDateChange(){ this.cycleRecordDate=document.getElementById('cyc-record-date').value; var c=this.state.cycle; var d=this.cycleRecordDate; this._cycSel={ sex:c.sex[d]||'none', symptoms:(c.symptoms[d]||[]).slice(), mood:(c.mood[d]||[]).slice() }; this.renderRecordBody(); },
  setRecordTab(tab){ this.recordTab=tab; ['sex','symptoms','mood','more'].forEach(function(t){ var b=document.getElementById('cyc-rtab-'+t); if(!b) return; if(t===tab){ b.className='flex-1 py-2 rounded-lg text-xs font-bold bg-rose-500 text-white'; } else { b.className='flex-1 py-2 rounded-lg text-xs font-bold bg-slate-100 text-slate-500'; } }); this.renderRecordBody(); },
  pickSex(k){ this._cycSel.sex=k; this.renderRecordBody(); },
  toggleCycSym(k){ var a=this._cycSel.symptoms; var i=a.indexOf(k); if(i>=0)a.splice(i,1); else a.push(k); this.renderRecordBody(); },
  toggleCycMood(k){ var a=this._cycSel.mood; var i=a.indexOf(k); if(i>=0)a.splice(i,1); else a.push(k); this.renderRecordBody(); },
  renderRecordBody(){

    } else if(tab==='symptoms'){
      html='<div class="space-y-4">';

        html+='<div><div class="text-xs font-bold text-slate-400 mb-2">'+cat+'</div><div class="flex flex-wrap gap-2">';
        CYCLE_SYMPTOMS[cat].forEach(function(s){ var sel=self._cycSel.symptoms.indexOf(s.k)>=0; html+='<button onclick="app.toggleCycSym(\''+s.k+'\')" class="cyc-chip '+(sel?'sel':'bg-white border-2 border-slate-200 text-slate-600')+' rounded-xl px-3 py-2 flex items-center gap-1.5"><span>'+s.i+'</span><span class="text-xs font-bold">'+s.l+'</span></button>'; });
        html+='</div></div>';
      });
      html+='</div>';
    } else if(tab==='mood'){
      html='<div class="flex flex-wrap gap-2">'+CYCLE_MOOD.map(function(s){ var sel=self._cycSel.mood.indexOf(s.k)>=0; return '<button onclick="app.toggleCycMood(\''+s.k+'\')" class="cyc-chip '+(sel?'sel':'bg-white border-2 border-slate-200 text-slate-600')+' rounded-xl px-3 py-2 flex items-center gap-1.5"><span class="text-xl">'+s.i+'</span><span class="text-xs font-bold">'+s.l+'</span></button>'; }).join('')+'</div>';
    } else if(tab==='more'){
      var c=self.state.cycle; var d=self.cycleRecordDate;
      var note=(c.notes&&c.notes[d])?c.notes[d]:'';
      html='<div class="space-y-3"><div><label class="text-xs font-bold text-slate-400">基础体温（℃）</label><input id="cyc-bbt" type="number" step="0.01" placeholder="如 36.50" value="'+(c.bbt[d]||'')+'" class="w-full mt-1 px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:border-rose-400 outline-none"></div>'+
        '<div><label class="text-xs font-bold text-slate-400">备注</label><input id="cyc-note" type="text" placeholder="选填" value="'+note+'" class="w-full mt-1 px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:border-rose-400 outline-none"></div></div>';
    }
    document.getElementById('cyc-record-body').innerHTML=html;
  },
  saveCycleRecord(){
    var date=this.cycleRecordDate; var c=this.state.cycle; var tab=this.recordTab;
    if(tab==='sex'){ if(this._cycSel.sex && this._cycSel.sex!=='none') c.sex[date]=this._cycSel.sex; else delete c.sex[date]; }
    else if(tab==='symptoms'){ if(this._cycSel.symptoms.length) c.symptoms[date]=this._cycSel.symptoms.slice(); else delete c.symptoms[date]; }
    else if(tab==='mood'){ if(this._cycSel.mood.length) c.mood[date]=this._cycSel.mood.slice(); else delete c.mood[date]; }
    else if(tab==='more'){ var v=parseFloat(document.getElementById('cyc-bbt').value); if(!isNaN(v)) c.bbt[date]=v; else delete c.bbt[date]; var nt=document.getElementById('cyc-note').value; if(!c.notes) c.notes={}; if(nt) c.notes[date]=nt; else delete c.notes[date]; }
    this.saveState(); this.closeRecordModal(); this.renderCycle(); this.toast('✅ 已保存');
  },

  /* ===== SETTINGS ===== */
  openSettings(){
    document.getElementById('set-water-goal').value=this.state.settings.waterGoal||8;
    document.getElementById('set-weight-goal').value=this.state.settings.weightGoal||'';
    document.getElementById('set-waist-goal').value=this.state.settings.waistGoal||'';
    document.getElementById('settings-modal').classList.remove('hidden');
  },
  closeSettings(){ document.getElementById('settings-modal').classList.add('hidden'); },
  saveSettings(){
    var wGoal=parseInt(document.getElementById('set-water-goal').value)||8;
    var wtGoal=parseFloat(document.getElementById('set-weight-goal').value)||null;
    var wsGoal=parseFloat(document.getElementById('set-waist-goal').value)||null;
    this.state.settings.waterGoal=Math.max(1,Math.min(20,wGoal));
    this.state.settings.weightGoal=wtGoal;
    this.state.settings.waistGoal=wsGoal;
    this.saveState(); this.closeSettings(); this.switchTab(this.currentTab);
    this.toast('✅ 设置已保存');
  }
};

window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='reload-from-sync'){ app.loadState(); app.switchTab(app.currentTab); }
});

app.init();
</script>
</body>
</html>
