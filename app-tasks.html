<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TickTick Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TickTick Pro">
    <meta name="theme-color" content="#3b82f6">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="tailwind.css">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        
        :root {
            --bg-body: #ffffff;
            --text-main: #1c1c1e;
            --accent: #3b82f6;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --topbar-h: 44px;
            --tabbar-h: 54px;
        }

        html, body { height: 100%; overscroll-behavior: none; }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            overflow: hidden; 
            -webkit-font-smoothing: antialiased;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .nav-item { transition: all 0.15s ease; border-radius: 6px; }
        .nav-item:hover { background-color: rgba(0,0,0,0.04); }
        .nav-item.active { background-color: #e5f1ff; color: var(--accent); font-weight: 600; }

        /* Custom Checkbox */
        .tk-checkbox {
            appearance: none; width: 16px; height: 16px; border: 1.5px solid #d1d5db; 
            border-radius: 4px; cursor: pointer; transition: all 0.2s; position: relative;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .tk-checkbox:checked { border-color: currentColor; background-color: currentColor; }
        .tk-checkbox:checked::after {
            content: ''; width: 4px; height: 8px; border: solid white; border-width: 0 2px 2px 0;
            transform: rotate(45deg); position: absolute; top: 1px;
        }

        input[type="color"] {
            -webkit-appearance: none; border: none; width: 32px; height: 32px; border-radius: 50%; overflow: hidden; cursor: pointer; padding: 0;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; border: 2px solid #e5e7eb; }

        .view-section { display: none; height: 100%; width: 100%; flex-direction: column; }
        
        .drag-time-cursor { cursor: ns-resize; user-select: none; }

        /* ======== iPhone Mobile Layout ======== */
        /* Top bar */
        .mobile-topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 45;
            height: calc(var(--topbar-h) + var(--safe-top));
            padding-top: var(--safe-top);
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid #e5e7eb;
            display: flex; align-items: center; justify-content: space-between;
            padding-left: 8px; padding-right: 8px;
        }
        .mobile-topbar button { flex-shrink: 0; }
        .mobile-topbar h1 { font-size: 17px; font-weight: 700; color: #1c1c1e; text-align: center; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Main content area */
        .mobile-main-wrap {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            padding-top: calc(var(--topbar-h) + var(--safe-top));
            padding-bottom: calc(var(--tabbar-h) + var(--safe-bottom));
            overflow: hidden;
        }
        .mobile-main-wrap > #main-content-area { height: 100%; overflow-y: auto; overflow-x: hidden; }

        /* Bottom tab bar */
        .mobile-tabbar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 45;
            height: calc(var(--tabbar-h) + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 0.5px solid #e5e7eb;
            display: flex; align-items: stretch;
        }
        .tab-btn {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 2px; color: #9ca3af; font-size: 10px; font-weight: 500;
            transition: color 0.15s; -webkit-tap-highlight-color: transparent;
        }
        .tab-btn i { font-size: 18px; }
        .tab-btn.active { color: var(--accent); }

        /* Drawer (sidebar as slide-in) */
        #drawer-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 55;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #drawer-backdrop.open { opacity: 1; pointer-events: auto; }
        #main-sidebar {
            position: fixed !important; top: 0; left: 0; bottom: 0;
            transform: translateX(-100%); transition: transform 0.3s ease;
            z-index: 60; box-shadow: 4px 0 30px rgba(0,0,0,0.15);
        }
        #main-sidebar.open { transform: translateX(0); }
        #main-sidebar .sidebar-inner { padding-top: var(--safe-top); }

        /* Task detail editor: compact centered sheet, matching the native task editor */
        #task-detail-sidebar {
            position: fixed !important; left: 50% !important; top: 50% !important; right: auto !important; bottom: auto !important;
            width: min(94vw, 560px) !important; height: min(82vh, 600px) !important; max-width: 560px !important; max-height: 600px !important;
            transform: translate(-50%, -50%) !important; z-index: 70 !important;
            border-radius: 22px !important; border: 1px solid #e5e7eb !important;
            box-shadow: 0 22px 70px rgba(15,23,42,.24) !important; background: white !important;
            transition: opacity .2s ease, transform .2s ease !important;
        }
        #task-detail-sidebar.translate-x-full { transform: translate(-50%, -46%) !important; opacity: 0 !important; pointer-events: none !important; }
        #task-detail-sidebar .detail-inner { padding-top: 8px !important; }
        #task-detail-sidebar .fa-trash-alt { color: #ef4444 !important; font-size: 16px !important; }
        #task-detail-backdrop { background: rgba(15,23,42,.28) !important; backdrop-filter: blur(2px); }

        /* Section padding: remove desktop left padding, use mobile padding */
        #view-tasks > div, #view-habits > div, #view-countdown > div, #view-stats > div {
            padding-left: 16px !important; padding-right: 16px !important;
        }
        #view-tasks > div { padding-top: 8px !important; }
        #view-habits > div, #view-countdown > div, #view-stats > div { padding-top: 16px !important; padding-bottom: 20px !important; }

        /* Hide desktop sidebar toggle button */
        #sidebar-toggle-btn { display: none !important; }

        /* Quick add responsive */
        #quick-add-bar { padding: 8px !important; }

        /* Calendar mobile adjustments */
        #view-calendar .cal-header { padding-left: 4px !important; flex-wrap: wrap; gap: 6px; }
        #calendar-grid > div { min-height: 48px; }
        #calendar-grid > div > div:first-child { font-size: 10px !important; }

        /* Stats grid responsive */
        #view-stats .stat-cards { grid-template-columns: repeat(2, 1fr) !important; }

        /* Countdown grid responsive (cards now compact) */
        #countdown-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
        @media (min-width: 768px) { #countdown-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; } }
        @media (min-width: 1024px) { #countdown-grid { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; } }

        /* Countdown cards smaller */
        .cd-card { min-height: 152px; }
        .cd-card .cd-date-pill { max-width: 100%; overflow: hidden; }
        .cd-card .cd-date-pill > span { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
        /* Countdown drag states */
        .cd-card.dragging { opacity: 0.4; transform: scale(0.97); }
        .cd-card.drag-over { outline: 2px dashed rgba(255,255,255,0.9); outline-offset: -4px; }
        #countdown-grid.show-drag-hint .cd-card { transition: transform 0.15s, opacity 0.15s; }

        /* Habit grid responsive */
        #habit-list-container { grid-template-columns: 1fr !important; }

        /* Focus timer sizing for mobile */
        #view-focus .focus-ring-wrap { width: 260px !important; height: 260px !important; }
        #view-focus #focus-time-display { font-size: 4.5rem !important; }

        /* Modals: ensure scrollable on small screens */
        #global-modals > div { padding: 16px !important; }
        #global-modals > div > div { max-width: 340px !important; width: 100% !important; max-height: 85vh !important; overflow-y: auto !important; }
        /* 日详情面板：保持较宽宽度，内部滚动 */
        #global-modals > div > div#modal-day-panel { max-width: 420px !important; overflow: hidden !important; }
        #day-panel-tasks { overflow-y: auto !important; }

        /* Prevent text selection on buttons */
        button { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-white text-[14px] text-gray-800 antialiased overflow-hidden">

    <!-- ===== Mobile Top Bar ===== -->
    <header class="mobile-topbar">
        <button class="w-10 h-10 flex items-center justify-center text-gray-600 active:text-blue-500" onclick="app.toggleSidebar()" title="菜单">
            <i class="fas fa-bars text-[17px]"></i>
        </button>
        <h1 id="mobile-page-title">今天</h1>
        <button class="w-10 h-10 flex items-center justify-center text-blue-500 active:text-blue-700" onclick="app.mobileAdd()" title="新建">
            <i class="fas fa-plus text-[18px]"></i>
        </button>
    </header>

    <!-- ===== Drawer Backdrop ===== -->
    <div id="drawer-backdrop" onclick="app.toggleSidebar()"></div>

    <!-- ===== Drawer / Sidebar ===== -->
    <aside id="main-sidebar" class="w-[280px] h-full bg-[#f8f8f8] border-r border-gray-200 flex flex-col flex-shrink-0 overflow-hidden">
        <div class="px-5 pt-8 pb-4 shrink-0 w-[280px]" style="padding-top: calc(env(safe-area-inset-top, 0px) + 24px);">
            <div class="flex items-center gap-3 mb-6">
                <img src="icon-180.png" class="w-8 h-8 rounded-lg shadow-sm" alt="Logo">
                <span class="font-bold text-lg tracking-tight text-gray-900">TickTick Pro</span>
            </div>
            <div class="relative group">
                <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-xs group-focus-within:text-blue-500 transition-colors"></i>
                <input type="text" id="global-search" placeholder="搜索任务..." class="w-full bg-gray-200/50 text-xs rounded-md pl-8 pr-3 py-1.5 outline-none focus:bg-white focus:ring-1 focus:ring-blue-400 transition-all">
            </div>
        </div>

        <div class="flex-1 overflow-y-auto no-scrollbar px-3 space-y-5 pb-4 relative w-[280px]">
            <div class="space-y-0.5">
                <button class="nav-item view-tab w-full flex items-center justify-between px-3 py-1.5 text-gray-700" data-target="view-tasks" data-filter="inbox">
                    <div class="flex items-center gap-3"><i class="fas fa-inbox w-4 text-center text-blue-500"></i><span class="text-sm">收集箱</span></div>
                    <span class="text-xs text-gray-400 font-medium" id="count-inbox"></span>
                </button>
                <button class="nav-item view-tab w-full flex items-center justify-between px-3 py-1.5 text-gray-700 active" data-target="view-tasks" data-filter="today">
                    <div class="flex items-center gap-3"><i class="far fa-star w-4 text-center text-yellow-500"></i><span class="text-sm">今天</span></div>
                    <span class="text-xs text-gray-400 font-medium" id="count-today"></span>
                </button>
                <button class="nav-item view-tab w-full flex items-center justify-between px-3 py-1.5 text-gray-700" data-target="view-tasks" data-filter="next7">
                    <div class="flex items-center gap-3"><i class="far fa-calendar-alt w-4 text-center text-purple-500"></i><span class="text-sm">本周</span></div>
                </button>
                
                <div id="sidebar-filters" class="pt-1 space-y-0.5"></div>
                
                <button class="nav-item view-tab w-full flex items-center gap-3 px-3 py-1.5 text-gray-700 mt-2" data-target="view-calendar">
                    <i class="far fa-calendar w-4 text-center text-red-400"></i><span class="text-sm">月历视图</span>
                </button>

                <div id="sidebar-archive" class="space-y-0.5 pt-1 hidden">
                     <div class="nav-item w-full flex items-center justify-between px-3 py-1.5 text-gray-400 cursor-pointer group" onclick="app.toggleArchive()">
                        <div class="flex items-center gap-3"><i class="fas fa-archive w-4 text-center"></i><span class="text-sm">归档</span></div>
                        <i class="fas fa-chevron-down text-[10px] transition-transform" id="archive-chevron"></i>
                    </div>
                    <div id="archive-list-container" class="hidden pl-7 pr-2 space-y-0.5"></div>
                </div>
            </div>

            <div class="space-y-0.5 pt-2 border-t border-gray-200/60">
                <div class="px-3 text-xs font-bold text-gray-400 mb-1 flex justify-between items-center group drag-item" ondragover="app.handleDragOver(event)" ondrop="app.handleDrop(event, 'root', 'folder')">
                    <div class="flex items-center gap-1.5 cursor-pointer hover:text-gray-600 transition-colors" onclick="app.toggleListSection()">
                        <i id="toggle-list-section-icon" class="fas fa-chevron-down text-[10px] transition-transform"></i>
                        <span>清单</span>
                    </div>
                    <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                        <i class="fas fa-folder-plus cursor-pointer hover:text-gray-700" title="新建文件夹" onclick="event.stopPropagation(); modals.openFolderModal()"></i>
                        <i class="fas fa-plus cursor-pointer hover:text-gray-700" title="新建清单" onclick="event.stopPropagation(); modals.openListModal()"></i>
                    </div>
                </div>
                <div id="sidebar-lists" class="space-y-0.5 transition-all overflow-hidden origin-top"></div>
            </div>

            <div class="space-y-0.5 pt-2 border-t border-gray-200/60">
                <div class="px-3 text-xs font-bold text-gray-400 mb-1">模块</div>
                <button class="nav-item view-tab w-full flex items-center gap-3 px-3 py-1.5 text-gray-700" data-target="view-habits">
                    <i class="fas fa-seedling w-4 text-center text-green-500"></i><span class="text-sm">习惯打卡</span>
                </button>
                <button class="nav-item view-tab w-full flex items-center gap-3 px-3 py-1.5 text-gray-700" data-target="view-focus">
                    <i class="fas fa-stopwatch w-4 text-center text-orange-400"></i><span class="text-sm">沉浸番茄</span>
                </button>
                <button class="nav-item view-tab w-full flex items-center gap-3 px-3 py-1.5 text-gray-700" data-target="view-countdown">
                    <i class="far fa-hourglass w-4 text-center text-teal-500"></i><span class="text-sm">倒数日</span>
                </button>
                <button class="nav-item view-tab w-full flex items-center gap-3 px-3 py-1.5 text-gray-700" data-target="view-stats">
                    <i class="fas fa-chart-pie w-4 text-center text-indigo-500"></i><span class="text-sm">统计</span>
                </button>
            </div>

            <div class="space-y-1 pt-2 border-t border-gray-200/60 pb-4">
                <div class="px-3 text-xs font-bold text-gray-400 flex justify-between items-center group">
                    <span>标签</span>
                    <i class="fas fa-plus cursor-pointer opacity-0 group-hover:opacity-100 transition-opacity hover:text-gray-700" onclick="modals.openTagModal()"></i>
                </div>
                <div id="sidebar-tags" class="flex flex-wrap gap-1.5 px-3 pt-1"></div>
            </div>
        </div>

        <div class="p-3 border-t border-gray-200/60 bg-[#f8f8f8] flex justify-between items-center gap-2 relative z-10 shadow-[0_-4px_10px_rgba(0,0,0,0.02)] w-[280px]" style="padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);">
             <button class="flex-1 flex items-center justify-center gap-2 px-3 py-1.5 text-gray-500 hover:text-gray-800 hover:bg-gray-200/50 rounded-md transition text-xs font-medium" onclick="modals.openFilterModal()">
                <i class="fas fa-plus"></i> 新建筛选器
             </button>
             <div class="flex gap-1 text-gray-400">
                 <button class="w-7 h-7 rounded hover:bg-gray-200/50 hover:text-gray-700 transition flex items-center justify-center" onclick="app.exportData()" title="导出备份"><i class="fas fa-file-export text-xs"></i></button>
                 <button class="w-7 h-7 rounded hover:bg-gray-200/50 hover:text-gray-700 transition flex items-center justify-center" onclick="document.getElementById('import-file').click()" title="导入备份"><i class="fas fa-file-import text-xs"></i></button>
                 <input type="file" id="import-file" class="hidden" accept=".json" onchange="app.importData(event)">
             </div>
        </div>
    </aside>

    <main class="mobile-main-wrap bg-white overflow-hidden flex">
        
        <button id="sidebar-toggle-btn" onclick="app.toggleSidebar()" class="absolute top-4 left-4 z-40 w-8 h-8 flex items-center justify-center text-gray-400 hover:text-gray-700 bg-white hover:bg-gray-50 border border-gray-100 rounded-md shadow-sm transition" title="展开/收起侧边栏">
            <i class="fas fa-bars text-[13px]"></i>
        </button>

        <div class="flex-1 h-full relative overflow-y-auto no-scrollbar" id="main-content-area">
            
            <!-- 1. 待办事项 -->
            <section id="view-tasks" class="view-section" style="display: flex;">
                <div class="max-w-4xl mx-auto w-full h-full flex flex-col px-10">
                    <div class="pt-2 pb-3 flex justify-between items-end border-b border-gray-100 shrink-0">
                        <h1 class="text-2xl font-bold tracking-tight text-gray-900 flex items-center gap-2" id="task-view-title">今天 <span class="text-[9px] font-normal text-gray-300 align-top">v23</span></h1>
                    </div>

                    <div class="py-2 shrink-0">
                        <div id="quick-add-bar" class="bg-white border border-gray-200 rounded-lg shadow-sm p-2 shrink-0 flex flex-col gap-2 transition-shadow focus-within:shadow-md focus-within:border-blue-300">
                            <div class="flex items-center gap-2 border-b border-dashed border-gray-200 pb-1 focus-within:border-blue-500 transition-colors">
                                <input type="text" id="quick-add-title" placeholder="输入日程或任务 (按回车直接保存)" class="w-full text-sm font-medium outline-none placeholder-gray-400 bg-transparent">
                                <button class="text-gray-400 hover:text-blue-500 transition px-1" onclick="document.getElementById('quick-add-desc').classList.toggle('hidden')" title="添加附加信息/备注"><i class="fas fa-align-left text-xs"></i></button>
                            </div>
                            <input type="text" id="quick-add-desc" placeholder="附加信息 / 备注 (可选)" class="w-full text-xs outline-none text-gray-500 hidden pb-1 border-b border-gray-100">
                            
                            <div class="flex flex-wrap items-center gap-1.5 mt-0.5">
                                <div class="flex items-center gap-1 border border-gray-200 rounded px-2 py-1 hover:border-blue-300 transition-colors bg-gray-50/50">
                                    <i class="far fa-calendar-alt text-gray-400 text-[10px]"></i>
                                    <input type="date" id="quick-add-date" class="text-xs outline-none bg-transparent text-gray-700 cursor-pointer">
                                </div>
                                <select id="quick-add-day-type" class="border border-gray-200 rounded px-2 py-1.5 text-xs outline-none bg-gray-50/50 text-gray-700 hover:border-blue-300 transition-colors cursor-pointer" onchange="app.toggleQuickAddMultiDay()">
                                    <option value="single">单天</option><option value="multi">跨天</option>
                                </select>
                                <div id="quick-add-end-date-wrapper" class="hidden items-center gap-1 border border-gray-200 rounded px-2 py-1 hover:border-blue-300 transition-colors bg-gray-50/50">
                                    <span class="text-gray-400 text-xs">-</span>
                                    <input type="date" id="quick-add-end-date" class="text-xs outline-none bg-transparent text-gray-700 cursor-pointer">
                                </div>
                                <select id="quick-add-time-type" class="border border-gray-200 rounded px-2 py-1.5 text-xs outline-none bg-gray-50/50 text-gray-700 hover:border-blue-300 transition-colors cursor-pointer" onchange="app.toggleQuickAddTime()">
                                    <option value="none">无时间要求</option><option value="time">具体时间</option><option value="range">时间段</option>
                                </select>
                                <input type="time" id="quick-add-start-time" class="border border-gray-200 rounded p-1 outline-none text-gray-600 hidden bg-gray-50 w-20">
                                <span id="quick-add-time-sep" class="hidden text-xs text-gray-400">-</span>
                                <input type="time" id="quick-add-end-time" class="border border-gray-200 rounded p-1 outline-none text-gray-600 hidden bg-gray-50 w-20">
                                <div class="flex items-center gap-1 border border-gray-200 rounded px-2 py-1 hover:border-blue-300 transition-colors bg-gray-50/50">
                                    <i class="fas fa-inbox text-gray-400 text-[10px]"></i>
                                    <select id="quick-add-list" class="text-xs outline-none bg-transparent text-gray-700 cursor-pointer max-w-[120px]"></select>
                                </div>
                                <div class="relative" id="quick-add-tags-container">
                                    <button type="button" id="quick-add-tags-btn" class="border border-gray-200 rounded px-2 py-1.5 text-xs outline-none bg-gray-50/50 text-gray-700 flex items-center gap-1 hover:border-blue-300 transition-colors" onclick="document.getElementById('quick-add-tags-dropdown').classList.toggle('hidden')">
                                        <i class="fas fa-tags text-gray-400"></i> 标签
                                    </button>
                                    <div class="absolute top-full left-0 mt-1 w-56 bg-white border border-gray-100 shadow-[0_10px_40px_rgba(0,0,0,0.1)] rounded-xl p-3 hidden flex-wrap gap-1.5 z-50" id="quick-add-tags-dropdown"></div>
                                </div>
                                <select id="quick-add-priority" class="border border-gray-200 rounded px-2 py-1.5 text-xs outline-none bg-gray-50/50 text-gray-700 hover:border-blue-300 transition-colors cursor-pointer">
                                    <option value="none">无优先级</option><option value="low">低优</option><option value="medium">中优</option><option value="high">高优</option>
                                </select>
                                <div class="flex-1"></div>
                                <button class="bg-blue-500 hover:bg-blue-600 text-white rounded-md px-4 py-1.5 text-xs transition font-medium shadow-sm flex items-center gap-1" onclick="app.submitQuickAdd()">
                                    <i class="fas fa-level-down-alt rotate-90 text-[10px]"></i> 保存
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="flex-1 overflow-y-auto no-scrollbar pb-20 pt-2" id="task-list-container">
                        <!-- JS 渲染 -->

    <script>
        const ICONS = ['fa-list-ul', 'fa-briefcase', 'fa-book', 'fa-heart', 'fa-plane', 'fa-shopping-cart', 'fa-laptop-code', 'fa-dumbbell', 'fa-graduation-cap', 'fa-music', 'fa-utensils', 'fa-home'];

        // Core State
        const state = {
            currentView: 'view-tasks',
            currentFilter: 'today', 
            calCurrentDate: new Date(),
            calViewMode: 'month', // 'month' or 'week'
            calListFilter: 'all', // 'all' | 'inbox' | listId | 'folder:'+folderId
            
            // Stats state
            statRange: 'week',
            
            // Sidebar Sections Collapse State
            listSectionCollapsed: false,
            
            editingTaskId: null, editingListId: null, editingFolderId: null,
            editingFilterId: null, editingTagId: null, editingCountdownId: null,
            editingHabitId: null,

            // 初始化为空数组，真正做到按照导入数据来的状态
            folders: [],
            lists: [],
            tags: [],
            filters: [],
            tasks: [],
            habits: [],
            countdowns: [],
            focus: { 
                mode: 'pomodoro', durationMinutes: 25, timeLeft: 25*60, 
                timer: null, active: false, taskId: null, sessionElapsed: 0 
            }
        };

        function getTodayStr() { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split('T')[0]; }
        function getDateStr(offset) { const d = new Date(); d.setDate(d.getDate() + offset); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split('T')[0]; }
        // 本周范围（周一 ~ 周日），返回 {start, end} YYYY-MM-DD
        function getWeekRange() {
            const d = new Date();
            const dow = d.getDay(); // 0=周日, 1=周一...
            const diffToMon = (dow === 0 ? 6 : dow - 1); // 距周一的天数
            const mon = new Date(d); mon.setDate(d.getDate() - diffToMon);
            const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
            const fmt = (x) => new Date(x.getTime() - x.getTimezoneOffset() * 60000).toISOString().split('T')[0];
            return { start: fmt(mon), end: fmt(sun) };
        }

        // Get Specific Date Range based on Reference Date
        function getStatDateRange(range, refDateStr) {
            const refDate = new Date(refDateStr || getTodayStr());
            refDate.setHours(12, 0, 0, 0); 
            let start, end;
            
            if (range === 'week') {
                const day = refDate.getDay() || 7;
                start = new Date(refDate);
                start.setDate(refDate.getDate() - day + 1);
                end = new Date(start);
                end.setDate(start.getDate() + 6);
            } 
            else if (range === 'month') {
                start = new Date(refDate.getFullYear(), refDate.getMonth(), 1, 12, 0, 0);
                end = new Date(start.getFullYear(), start.getMonth() + 1, 0, 12, 0, 0);
            }
            else if (range === 'quarter') {
                const currentQ = Math.floor(refDate.getMonth() / 3);
                start = new Date(refDate.getFullYear(), currentQ * 3, 1, 12, 0, 0);
                end = new Date(start.getFullYear(), start.getMonth() + 3, 0, 12, 0, 0);
            }
            else if (range === 'year') {
                start = new Date(refDate.getFullYear(), 0, 1, 12, 0, 0);
                end = new Date(start.getFullYear(), 11, 31, 12, 0, 0);
            }
            
            return {
                startStr: start.toISOString().split('T')[0],
                endStr: end.toISOString().split('T')[0],
                startDate: start,
                endDate: end
            };
        }

        const router = {
            init() {
                document.querySelectorAll('.view-tab').forEach(tab => {
                    tab.addEventListener('click', (e) => {
                        if(e.target.tagName.toLowerCase() === 'i' && e.target.onclick) return; 
                        document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
                        tab.classList.add('active');
                        this.switchView(tab.dataset.target, tab.dataset.filter, tab.querySelector('span.text-sm').innerText);
                    });
                });
            },
            switchView(viewId, filterId, title) {
                app.closeTaskSidebar();
                app.closeSidebar();
                document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
                document.getElementById(viewId).style.display = 'flex';
                state.currentView = viewId;
                state.currentFilter = filterId || null;

                // Update mobile title and tab bar
                if (title) app.updateMobileTitle(title);

            // ===== PWA: localStorage persistence =====
            loadState() {
                // 取消待执行的保存定时器，防止旧的内存状态覆盖刚加载的同步数据
                clearTimeout(this._saveTimer);
                try {
                    const saved = localStorage.getItem('ticktick_pro_state');
                    // 习惯独立存储到 habit_pro_state（避免和任务共用键导致同步时被任务覆盖）。
                    // 旧版本习惯存在 ticktick_pro_state 里，首次加载时迁移到独立键。
                    let habits = [];
                    const habitRaw = localStorage.getItem('habit_pro_state');
                    if (habitRaw) {
                        try { habits = JSON.parse(habitRaw) || []; } catch (e) { habits = []; }
                    } else if (saved) {
                        try { const s = JSON.parse(saved); if (s && Array.isArray(s.habits)) habits = s.habits; } catch (e) {}
                        if (habits.length) localStorage.setItem('habit_pro_state', JSON.stringify(habits));
                    }
                    if (saved) {
                        _lastStateStr = saved; // 更新追踪值
                        const s = JSON.parse(saved);
                        state.folders = s.folders || [];
                        state.lists = s.lists || [];
                        state.tags = s.tags || [];
                        state.filters = s.filters || [];
                        state.tasks = s.tasks || [];
                        state.countdowns = s.countdowns || [];
                        if (s.focus) {
                            state.focus = Object.assign({}, state.focus, s.focus, { timer: null, active: false, sessionElapsed: 0 });
                        }
                    }
                    state.habits = habits;
                } catch(e) { console.error('Load state failed', e); }
            },

            saveState() {
                clearTimeout(this._saveTimer);
                this._saveTimer = setTimeout(() => {
                    try {
                        const s = Object.assign({}, state);
                        delete s.focus.timer;
                        // 习惯单独存到 habit_pro_state，避免和任务共用键在同步时被任务覆盖
                        delete s.habits;
                        const str = JSON.stringify(s);
                        localStorage.setItem('ticktick_pro_state', str);
                        localStorage.setItem('habit_pro_state', JSON.stringify(state.habits || []));
                        _lastStateStr = str; // 更新追踪值，避免轮询误触发
                        // Notify parent dashboard to refresh
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage({ type: 'dashboard-refresh', key: 'ticktick_pro_state' }, '*');
                            window.parent.postMessage({ type: 'dashboard-refresh', key: 'habit_pro_state' }, '*');
                        }

                }, 300);
