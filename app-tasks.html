            // 获取农历日期文本（如"农历六月十五"）
            getLunarDateStr(solarDateStr) {
                if(typeof Lunar === 'undefined') return '';
                try {
                    var parts = solarDateStr.split('-');
                    var s = Solar.fromYmd(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));
                    var l = s.getLunar();
                    var monthStr = l.getMonthInChinese();
                    var dayStr = l.getDayInChinese();
                    var isLeap = l.getMonth() < 0;
                    return (isLeap ? '闰' : '') + '农历' + monthStr + '月' + dayStr;
                } catch(e) { return ''; }
            },

            // 计算循环倒数日的下一次出现日期
            getNextCountdownDate(cd) {
                var baseDate = new Date(cd.date);
                if(isNaN(baseDate.getTime())) return baseDate;
                baseDate.setHours(0,0,0,0);
                var today = new Date(); today.setHours(0,0,0,0);

                if(!cd.repeat || cd.repeat === 'none') return baseDate;

                // 农历每年重复：需要将农历日期转换到当前/下一年
                if(cd.calendar === 'lunar' && cd.repeat === 'annual' && typeof Lunar !== 'undefined') {
                    try {
                        var parts = cd.date.split('-');
                        var baseSolar = Solar.fromYmd(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));
                        var baseLunar = baseSolar.getLunar();
                        var lunarMonth = Math.abs(baseLunar.getMonth()); // 取绝对值（闰月用普通月）
                        var lunarDay = baseLunar.getDay();

                        // 尝试今年
                        var thisYear = today.getFullYear();
                        var candidate = Lunar.fromYmd(thisYear, lunarMonth, lunarDay).getSolar();
                        var candDate = new Date(candidate.getYear(), candidate.getMonth() - 1, candidate.getDay());
                        candDate.setHours(0,0,0,0);
                        if(candDate >= today) return candDate;
                        // 明年
                        var next = Lunar.fromYmd(thisYear + 1, lunarMonth, lunarDay).getSolar();
                        var nextDate = new Date(next.getYear(), next.getMonth() - 1, next.getDay());
                        nextDate.setHours(0,0,0,0);
                        return nextDate;
                    } catch(e) {
                        console.error('Lunar conversion error:', e);
                        return baseDate;
                    }
                }

                if(cd.repeat === 'weekly') {
                    var targetDay = baseDate.getDay();
                    if(today.getDay() === targetDay) return today;
                    var next = new Date(today);
                    var diff = (targetDay - today.getDay() + 7) % 7;
                    next.setDate(today.getDate() + diff);
                    return next;
                }

                if(cd.repeat === 'monthly') {
                    var targetDom = baseDate.getDate();
                    if(today.getDate() === targetDom) return today;
                    var daysInThisMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
                    var dayThis = Math.min(targetDom, daysInThisMonth);
                    var candidate = new Date(today.getFullYear(), today.getMonth(), dayThis);
                    candidate.setHours(0,0,0,0);
                    if(candidate >= today) return candidate;
                    var daysInNextMonth = new Date(today.getFullYear(), today.getMonth() + 2, 0).getDate();
                    var dayNext = Math.min(targetDom, daysInNextMonth);
                    return new Date(today.getFullYear(), today.getMonth() + 1, dayNext);
                }

                if(cd.repeat === 'annual') {
                    var targetMonth = baseDate.getMonth();
                    var targetDay = baseDate.getDate();
                    var cand = new Date(today.getFullYear(), targetMonth, targetDay);
                    cand.setHours(0,0,0,0);
                    if(cand >= today) return cand;
                    return new Date(today.getFullYear() + 1, targetMonth, targetDay);
                }

                return baseDate;
            },

            renderCountdowns() {
                const c = document.getElementById('countdown-grid');
                const t = new Date(); t.setHours(0,0,0,0);
                
                const styles = [
                    'from-[#2b5876] to-[#4e4376]', 
                    'from-[#0ba360] to-[#3cba92]', 
                    'from-[#ff0844] to-[#ffb199]', 
                    'from-[#5f2c82] to-[#49a09d]'  
                ];

                const repeatLabels = {
                    'none': '',
                    'weekly': '🔁 每周',
                    'monthly': '🔁 每月',
                    'annual': '🔁 每年'
                };

                c.innerHTML = state.countdowns.map((cd, idx) => {
                    // 对于循环倒数日，计算下一次出现日期
                    const nextDate = this.getNextCountdownDate(cd);
                    const nextDateStr = _formatLocalDate(nextDate);
                    const diff = Math.ceil((nextDate - t) / 86400000);
                    const isToday = diff <= 0;
                    const past = diff < 0;
                    const days = Math.abs(diff);
                    
                    const bgStyle = past ? 'from-gray-300 to-gray-400' : styles[idx % 4];
                    const labelStr = isToday ? '今天' : (past ? '已经' : '还有');
                    
                    const repeatBadge = repeatLabels[cd.repeat] || '';
                    const isLunar = cd.calendar === 'lunar';
                    const lunarStr = isLunar ? this.getLunarDateStr(cd.date) : '';
                    // 循环农历日期，显示农历下次日期
                    const lunarNextStr = (isLunar && cd.repeat && cd.repeat !== 'none') ? this.getLunarDateStr(nextDateStr) : '';
                    
                    let tkHtml = '';
                    if(cd.taskId) {
                        const tk = state.tasks.find(x=>x.id===cd.taskId);
                        if(tk) tkHtml = `<div class="mt-2 text-[9px] bg-black/20 px-2 py-0.5 rounded-full inline-flex items-center backdrop-blur-sm text-white/90 max-w-full overflow-hidden"><i class="fas fa-link mr-1 opacity-80 flex-shrink-0"></i><span class="truncate">${tk.title}</span></div>`;
                    }
                    
                    // 徽章组合：农历 + 循环
                    let badgeHtml = '';
                    let badges = [];
                    if(isLunar) badges.push('📅 农历');
                    if(repeatBadge) badges.push(repeatBadge);
                    if(badges.length) badgeHtml = `<div class="absolute top-2.5 left-2.5 z-20 text-[9px] bg-white/25 backdrop-blur-sm px-1.5 py-0.5 rounded-full text-white font-semibold">${badges.join(' · ')}</div>`;
                    
                    return `
                        <div class="cd-card rounded-2xl p-5 shadow-lg relative overflow-hidden group transition-all hover:-translate-y-0.5 cursor-pointer bg-gradient-to-br ${bgStyle}" 
                             data-idx="${idx}" draggable="true"
                             ondragstart="countdownDrag.start(event, ${idx})"
                             ondragover="countdownDrag.over(event, ${idx})"
                             ondrop="countdownDrag.drop(event, ${idx})"
                             ondragend="countdownDrag.end()"
                             ondragleave="countdownDrag.leave(event, ${idx})"
                             onclick="modals.openCountdownModal('${cd.id}')">
                            <div class="absolute top-2.5 right-2.5 z-30 flex items-center gap-1">
                                <div class="cd-grip w-6 h-6 rounded-full bg-white/15 hover:bg-white/30 backdrop-blur-md flex items-center justify-center text-white/80 cursor-grab active:cursor-grabbing" title="拖拽排序" onclick="event.stopPropagation()">
                                    <i class="fas fa-grip-vertical text-[10px]"></i>
                                </div>
                                <div class="w-6 h-6 rounded-full bg-white/15 hover:bg-white/30 backdrop-blur-md flex items-center justify-center text-white opacity-0 group-hover:opacity-100 transition">
                                    <i class="fas fa-pen text-[9px]"></i>
                                </div>
                            </div>
                            ${badgeHtml}
                            <div class="absolute -right-3 -bottom-3 text-7xl opacity-[0.08] pointer-events-none mix-blend-overlay z-0">
                                <i class="${past?'fas fa-history':'fas fa-calendar-check'}"></i>
                            </div>
                            <div class="flex flex-col h-full text-white relative z-10 ${badges.length ? 'mt-5' : ''}">
                                <div class="text-[12px] font-semibold opacity-95 tracking-wide flex items-center gap-1.5 pr-14 min-w-0">
                                    <span class="w-1.5 h-1.5 rounded-full flex-shrink-0 ${past ? 'bg-gray-200' : 'bg-white shadow-[0_0_6px_rgba(255,255,255,0.8)]'}"></span> 
                                    <span class="truncate min-w-0">${cd.title}</span>
                                </div>
                                <div class="mt-2 flex items-baseline gap-1.5 drop-shadow-md">
                                    <span class="text-xs opacity-80">${labelStr}</span>
                                    <span class="text-4xl font-black tracking-tighter tabular-nums leading-none">${days}</span>
                                    <span class="text-xs font-medium opacity-80">天</span>
                                </div>
                                <div class="mt-auto pt-3 flex flex-col items-start gap-1 min-w-0 w-full">
                                    <div class="cd-date-pill text-[10px] font-medium opacity-80 bg-black/10 px-1.5 py-0.5 rounded backdrop-blur-sm">
                                        ${cd.repeat && cd.repeat !== 'none' ? '下次' : '目标日'}: <span class="font-bold font-mono tracking-normal ml-0.5">${nextDateStr}</span>
                                    </div>
                                    ${lunarNextStr ? `<div class="text-[9px] opacity-70 px-0.5 max-w-full truncate">📅 ${lunarNextStr}</div>` : (lunarStr ? `<div class="text-[9px] opacity-70 px-0.5 max-w-full truncate">📅 ${lunarStr}</div>` : '')}
                                    ${tkHtml}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                this.saveState();
            }
        };

        // 云同步：当外壳拉取云端数据写入 localStorage 时，自动刷新本应用
        window.addEventListener('storage', (e) => {
            if (e.key === 'ticktick_pro_state' && window.app) {
                app.loadState();
                app.renderSidebar();
                app.refreshCurrentView();
                app.updateCounts();
            }
        });
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'pb-sync-update' && window.app) {
                app.loadState();
                app.renderSidebar();
                app.refreshCurrentView();
                app.updateCounts();
            }
            // 看板导航请求：切换到指定模块
            if (e.data && e.data.type === 'nav-to-tab') {
                var r = window.router || (typeof router !== 'undefined' ? router : null);
                if (!r) { console.log('[tasks] router not ready yet'); return; }
                var viewId = e.data.viewId;
                var filterId = e.data.filterId || null;
                var title = e.data.title || '';
                var action = e.data.action || null;
                // 更新 tab 高亮
                document.querySelectorAll('.view-tab, .tab-btn').forEach(function(t){
                    t.classList.remove('active');
                    if(t.dataset.target === viewId) t.classList.add('active');
                });
                r.switchView(viewId, filterId, title);
                // 执行额外动作（如自动打开创建弹窗）
                if(action === 'create-habit') {
                    setTimeout(function(){ modals.openHabitModal(); }, 350);
                } else if(action === 'create-countdown') {
                    setTimeout(function(){ modals.openCountdownModal(); }, 350);
                } else if(action === 'create-task') {
                    setTimeout(function(){
                        var inp = document.getElementById('quick-add-title');
                        if(inp) inp.focus();
                    }, 350);
                }
                console.log('[tasks] navigated to', viewId, filterId, title, action);
            }
        });

        // ===== 云同步轮询：每2秒检查 localStorage 是否被外部（同步/其他标签页）修改 =====
        var _lastStateStr = localStorage.getItem('ticktick_pro_state') || '';
        var _syncReloading = false; // 防止重入
        setInterval(function() {
            if (_syncReloading) return;
            var current = localStorage.getItem('ticktick_pro_state') || '';
            if (current !== _lastStateStr && current) {
                console.log('[tasks] 检测到外部数据变更（同步/其他标签），重新加载...');
                _syncReloading = true;
                try {
                    app.loadState();
                    app.renderSidebar();
                    app.refreshCurrentView();
                    app.updateCounts();
                } catch(e) { console.error('[tasks] 同步重载失败', e); }
                _syncReloading = false;
            }
        }, 2000);

        // ===== 倒数日智能预设按钮 =====
        function _formatLocalDate(d) {
            var y = d.getFullYear();
            var m = String(d.getMonth() + 1).padStart(2, '0');
            var day = String(d.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + day;
        }

        // ===== 倒数日拖拽排序 =====
        var countdownDrag = {
            fromIdx: null,
            start: function(e, idx) {
                this.fromIdx = idx;
                e.dataTransfer.effectAllowed = 'move';
                try { e.dataTransfer.setData('text/plain', String(idx)); } catch(_) {}
                var card = e.target.closest('.cd-card');
                if(card) { card.classList.add('dragging'); document.getElementById('countdown-grid').classList.add('show-drag-hint'); }
            },
            over: function(e, idx) {
                e.preventDefault();
                if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
                if(this.fromIdx === null || this.fromIdx === idx) return;
                var card = e.currentTarget;
                if(card) card.classList.add('drag-over');
            },
            leave: function(e, idx) {
                var card = e.currentTarget;
                if(card) card.classList.remove('drag-over');
            },
            drop: function(e, idx) {
                e.preventDefault();
                e.stopPropagation();
                var card = e.currentTarget;
                if(card) card.classList.remove('drag-over');
                if(this.fromIdx === null || this.fromIdx === idx) { this.end(); return; }
                // reorder state.countdowns
                if(typeof state === 'undefined' || !state.countdowns) { this.end(); return; }
                var arr = state.countdowns;
                var moved = arr.splice(this.fromIdx, 1)[0];
                arr.splice(idx, 0, moved);
                // persist + re-render
                if(typeof app !== 'undefined') { app.saveState(); app.renderCountdowns(); }
                this.end();
            },
            end: function() {
                this.fromIdx = null;
                var grid = document.getElementById('countdown-grid');
                if(grid) { grid.classList.remove('show-drag-hint'); grid.querySelectorAll('.cd-card').forEach(function(c){ c.classList.remove('dragging'); c.classList.remove('drag-over'); }); }
            }
        };

        // ===== 倒数日触摸拖拽排序 (iOS / 触屏) =====
        // 通过把手(.cd-grip)触发，避免影响页面滚动
        var _touchDrag = null;
        function initCountdownTouchDrag() {
            var grid = document.getElementById('countdown-grid');
            if(!grid || grid._touchInit) return;
            grid._touchInit = true;
            grid.addEventListener('touchstart', function(e) {
                var grip = e.target.closest('.cd-grip');
                if(!grip) return;
                var card = grip.closest('.cd-card');
                if(!card) return;
                var idx = parseInt(card.getAttribute('data-idx'), 10);
                if(isNaN(idx)) return;
                _touchDrag = { fromIdx: idx, lastIdx: idx, startX: e.touches[0].clientX, startY: e.touches[0].clientY, moved: false };
                card.classList.add('dragging');
                grid.classList.add('show-drag-hint');
                e.preventDefault();
            }, { passive: false });
            grid.addEventListener('touchmove', function(e) {
                if(!_touchDrag) return;
                e.preventDefault();
                var t = e.touches[0];
                var dx = t.clientX - _touchDrag.startX;
                var dy = t.clientY - _touchDrag.startY;
                if(!_touchDrag.moved && Math.abs(dx) + Math.abs(dy) > 4) _touchDrag.moved = true;
                // 找到手指下方的卡片
                var el = document.elementFromPoint(t.clientX, t.clientY);
                var targetCard = el ? el.closest('.cd-card') : null;
                if(targetCard && grid.contains(targetCard)) {
                    var tIdx = parseInt(targetCard.getAttribute('data-idx'), 10);
                    if(!isNaN(tIdx) && tIdx !== _touchDrag.lastIdx) {
                        // 实时交换数组顺序并重绘
                        var arr = state.countdowns;
                        var movedItem = arr.splice(_touchDrag.lastIdx, 1)[0];
                        arr.splice(tIdx, 0, movedItem);
                        _touchDrag.lastIdx = tIdx;
                        _touchDrag.fromIdx = tIdx;
                        app.renderCountdowns();
                        // 重绘后重新给当前目标加高亮
                        var nc = grid.querySelector('.cd-card[data-idx="' + tIdx + '"]');
                        if(nc) nc.classList.add('drag-over');
                    }
                }
            }, { passive: false });
            grid.addEventListener('touchend', function(e) {
                if(!_touchDrag) return;
                if(_touchDrag.moved && typeof app !== 'undefined') { app.saveState(); }
                _touchDrag = null;
                var g = document.getElementById('countdown-grid');
                if(g) { g.classList.remove('show-drag-hint'); g.querySelectorAll('.cd-card').forEach(function(c){ c.classList.remove('dragging'); c.classList.remove('drag-over'); }); }
            });
            grid.addEventListener('touchcancel', function() {
                _touchDrag = null;
                var g = document.getElementById('countdown-grid');
                if(g) { g.classList.remove('show-drag-hint'); g.querySelectorAll('.cd-card').forEach(function(c){ c.classList.remove('dragging'); c.classList.remove('drag-over'); }); }
            });
        }
        // 农历日期预览：当选择"农历"时，实时显示对应的农历日期文本
        function _getLunarStr(solarDateStr) {
            if(typeof Lunar === 'undefined' || !solarDateStr) return '';
            try {
                var parts = solarDateStr.split('-');
                var s = Solar.fromYmd(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));
                var l = s.getLunar();
                var isLeap = l.getMonth() < 0;
                return (isLeap ? '闰' : '') + '农历' + l.getMonthInChinese() + '月' + l.getDayInChinese();
            } catch(e) { return ''; }
        }
        function updateLunarPreview() {
            var calRadio = document.querySelector('input[name="cd-calendar"]:checked');
            var isLunar = calRadio && calRadio.value === 'lunar';
            var preview = document.getElementById('cd-lunar-preview');
            var dateInput = document.getElementById('cd-edit-date');
            var repeatSel = document.getElementById('cd-edit-repeat');
            if(!preview || !dateInput) return;
            if(isLunar) {
                var lunarStr = _getLunarStr(dateInput.value);
                preview.innerText = lunarStr ? '📅 ' + lunarStr : '';
                preview.classList.remove('hidden');
                // 农历自动设为每年重复（如果当前是单次）
                if(repeatSel.value === 'none' || repeatSel.value === 'weekly' || repeatSel.value === 'monthly') {
                    repeatSel.value = 'annual';
                }
            } else {
                preview.classList.add('hidden');
            }
        }
        // 监听历法选择和日期变化
        document.querySelectorAll('input[name="cd-calendar"]').forEach(function(r){
            r.addEventListener('change', updateLunarPreview);
        });
        document.addEventListener('DOMContentLoaded', function(){
            var dateInput = document.getElementById('cd-edit-date');
            if(dateInput) dateInput.addEventListener('change', updateLunarPreview);
            initCountdownTouchDrag();
        });

        document.querySelectorAll('.cd-preset').forEach(function(btn){
            btn.addEventListener('click', function(){
                var preset = this.dataset.preset;
                var repeatSel = document.getElementById('cd-edit-repeat');
                var dateInput = document.getElementById('cd-edit-date');
                var titleInput = document.getElementById('cd-edit-title');
                var today = new Date(); today.setHours(0,0,0,0);

                if(preset === 'weekend') {
                    // 下一个周六
                    repeatSel.value = 'weekly';
                    var diff = (6 - today.getDay() + 7) % 7; // 6 = Saturday
                    if(diff === 0) diff = 7; // 如果今天是周六，跳到下周六
                    var sat = new Date(today); sat.setDate(today.getDate() + diff);
                    dateInput.value = _formatLocalDate(sat);
                    if(!titleInput.value) titleInput.value = '周末';
                } else if(preset === 'monthEnd') {
                    // 当前月最后一天（若已过则下月）
                    repeatSel.value = 'monthly';
                    var lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);
                    if(lastDay < today) {
                        lastDay = new Date(today.getFullYear(), today.getMonth() + 2, 0);
                    }
                    dateInput.value = _formatLocalDate(lastDay);
                    if(!titleInput.value) titleInput.value = '月底';
                } else if(preset === 'birthday') {
                    // 每年重复，农历（中国人生日常用农历），让用户选择日期
                    repeatSel.value = 'annual';
                    var lunarRadio = document.querySelector('input[name="cd-calendar"][value="lunar"]');
                    if(lunarRadio) {
                        lunarRadio.checked = true;
                        updateLunarPreview();
                    }
                    if(!titleInput.value) titleInput.value = '生日';
                    dateInput.focus();
                } else if(preset === 'newyear') {
                    // 下一个元旦
                    repeatSel.value = 'annual';
                    var ny = new Date(today.getFullYear() + 1, 0, 1);
                    dateInput.value = _formatLocalDate(ny);
                    if(!titleInput.value) titleInput.value = '元旦';
                }
            });
        });

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
